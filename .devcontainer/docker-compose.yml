# Services for .devcontainer/devcontainer.json (#694). Not used by the stack itself;
# the full pipeline still runs from Scraping_project/docker-compose.yml.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    # Same eviction policy the pipeline requires (volatile-lru; never allkeys-*).
    command: ["redis-server", "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped
