name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Scraping_project/requirements.txt

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check Scraping_project/src/ --select F,E4,E7,E9 --output-format=github

    - name: Type check with mypy
      run: |
        pip install mypy
        mypy Scraping_project/src/ --ignore-missing-imports --no-strict-optional || true

    - name: Security check with bandit
      run: |
        pip install bandit
        bandit -r Scraping_project/src/ -ll -f github || true

    - name: Run unit tests
      run: |
        cd Scraping_project
        python -m pytest tests/common/ tests/stage1/ -v --tb=short -m "not slow"

    - name: Run integration tests
      run: |
        cd Scraping_project
        python -m pytest tests/integration/ -v --tb=short --maxfail=5 -m "not slow"


  entrypoint-smoke:
    # Proves #142 AC: entrypoint modules import and a worker starts against Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Scraping_project/requirements.txt
        pip install pytest

    - name: Compose config resolves worker commands
      run: |
        docker compose -f Scraping_project/docker-compose.yml config >/tmp/compose.yml
        grep -q "src.workers.stage2_worker" /tmp/compose.yml
        grep -q "src.main" Scraping_project/Dockerfile

    - name: Import smoke (src.main + stage workers)
      run: |
        cd Scraping_project
        python -c "import src.main; import src.workers.stage1_worker, src.workers.stage2_worker, src.workers.stage3_worker, src.workers.stage4_worker; print('entrypoint imports ok')"
        python -m pytest tests/unit/test_docker_entrypoints.py -v

    - name: Redis + stage2 worker bring-up (no ModuleNotFoundError)
      env:
        REDIS_HOST: localhost
        REDIS_PORT: "6379"
      run: |
        cd Scraping_project
        set +e
        timeout 20 python -m src.workers.stage2_worker
        code=$?
        set -e
        if [ "$code" = "124" ] || [ "$code" = "0" ]; then
          echo "stage2 worker bring-up ok (exit=$code)"
          exit 0
        fi
        echo "stage2 worker failed early (exit=$code)"
        exit "$code"


  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build package
      run: |
        cd Scraping_project
        python -m pip install build
        python -m build

    - name: Deploy to Production
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          Scraping_project/dist/*.whl \
          $DEPLOY_USER@$DEPLOY_HOST:/opt/scraper/

        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          $DEPLOY_USER@$DEPLOY_HOST \
          "pip install --force-reinstall /opt/scraper/*.whl && systemctl restart scraper.service"
