name: CD - Build and Push Images

# Tags (v*) build, smoke-test and push the release images. Pull requests that
# touch the image recipe build and smoke-test the same targets without pushing,
# so a broken Dockerfile target fails the PR instead of the release (#449).
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'Scraping_project/Dockerfile'
      - 'Scraping_project/.dockerignore'
      - 'Scraping_project/docker/**'
      - 'Scraping_project/kafka-delta-ingest/**'
      - 'Scraping_project/requirements.txt'
      - 'Scraping_project/.trivyignore'
      - '.github/workflows/cd-release.yml'
  workflow_dispatch:

# Image builds are the heaviest jobs: a new push to a PR cancels its superseded
# build. Tag (release) runs are never cancelled. See main.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each image is a target in Scraping_project/Dockerfile.
          - image: kafka-delta-ingest
            smoke: --help                      # through the image ENTRYPOINT
          - image: crawler
            smoke: python cli.py --help
          - image: metrics
            smoke: python metrics_exporter.py --help
    # `secrets` is not available in step-level `if:` (GitHub rejects the
    # whole workflow file, which shows up as a failed run on every push).
    # Expose "push this run" through job env instead.
    env:
      PUSH: ${{ github.event_name == 'push' && secrets.GHCR_PAT != '' }}
      LOCAL_TAG: local/${{ matrix.image }}:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space (Rust build)
        if: matrix.image == 'kafka-delta-ingest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata for ${{ matrix.image }} image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ${{ matrix.image }} image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: ./Scraping_project
          file: ./Scraping_project/Dockerfile
          target: ${{ matrix.image }}
          load: true
          push: false
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test ${{ matrix.image }} image
        run: docker run --rm "$LOCAL_TAG" ${{ matrix.smoke }}

      # #499: CRITICAL vulnerabilities with an available fix fail the build (PRs
      # and releases), before anything is pushed. Unfixed CVEs cannot be acted on
      # here and are reported by the table but do not fail. Suppressions live in
      # Scraping_project/.trivyignore (reviewed list, see SECURITY section of
      # Scraping_project/trivy-reports/README.md). Pinned to a commit SHA, not a
      # mutable tag (trivy-action tags were force-pushed in the 2026 incident).
      - name: Trivy scan ${{ matrix.image }} image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          trivyignores: Scraping_project/.trivyignore

      - name: Push ${{ matrix.image }} image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./Scraping_project
          file: ./Scraping_project/Dockerfile
          target: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

      # anchore/syft-action does not exist (the job failed at "Set up job");
      # anchore/sbom-action is Anchore's Syft-based SBOM action.
      - name: Generate SBOM for ${{ matrix.image }} image
        if: env.PUSH == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false

      - name: Upload ${{ matrix.image }} SBOM
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
