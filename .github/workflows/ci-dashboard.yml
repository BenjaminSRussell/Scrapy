# Control Center client: syntax-check every ES module under app/ and run the
# node tests for its pure modules (router, state, format, layouts). Cheap: no
# install step; dashboard/package.json only marks the folder as ESM.
name: CI Dashboard

on:
  push:
    branches: [main]
    paths:
      - "Scraping_project/dashboard/**"
      - ".github/workflows/ci-dashboard.yml"
  pull_request:
    paths:
      - "Scraping_project/dashboard/**"
      - ".github/workflows/ci-dashboard.yml"

permissions:
  contents: read

# See main.yml for the concurrency rationale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Syntax check
        run: find Scraping_project/dashboard/app -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: node --test Scraping_project/dashboard/tests/
