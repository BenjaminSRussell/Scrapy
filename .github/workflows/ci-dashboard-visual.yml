# Browser smoke test of the Control Center on its demo feed (iPhone 15 and
# desktop, light and dark): it fails on a broken layer, a missing heading or any
# console error. Not a pixel diff (fonts and Chrome builds differ); the
# screenshots are uploaded for review as the dashboard-screenshots artifact.
name: CI Dashboard Visual

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Scraping_project/dashboard/**"
      - ".github/workflows/ci-dashboard-visual.yml"

# See main.yml for the concurrency rationale. Not on push to main: the PR run
# already uploads the artifact, and this install is the expensive step.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Smoke test (demo feed, 4 profiles)
        run: python Scraping_project/dashboard/tools/smoke.py --out Scraping_project/dashboard/visual
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-screenshots
          path: Scraping_project/dashboard/visual/*.png
          if-no-files-found: warn
          retention-days: 14
