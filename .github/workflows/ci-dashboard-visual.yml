# Optional Overview smoke screenshot (#1044). Not a pixel-diff gate: fonts and
# Chrome builds differ, so a capture failure must not fail the dashboard unit job.
# Produces one artifact, dashboard-overview-screenshot, containing overview.png.
name: CI Dashboard Visual

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Scraping_project/dashboard/**"
      - ".github/workflows/ci-dashboard-visual.yml"

# See main.yml for the concurrency rationale. Not on push to main: the PR run
# already uploads the artifact, and this install is the expensive step.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overview-screenshot:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Capture Overview screenshot
        run: python Scraping_project/dashboard/overview_screenshot.py --out Scraping_project/dashboard/visual/overview.png
      - name: Upload Overview screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-overview-screenshot
          path: Scraping_project/dashboard/visual/overview.png
          if-no-files-found: warn
          retention-days: 14
