name: CI Kafka Alerts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-kafka-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml pytest

      # pytest (not unittest) like the rest of the repo (#299). --noconftest keeps this job
      # on pyyaml+pytest only; -o addopts= drops the coverage/xdist options from pytest.ini.
      - name: Run tests
        working-directory: Scraping_project
        run: |
          python3 -m pytest tests/observability/test_kafka_lag_alert.py tests/observability/test_recording_rules.py \
            -o addopts= -p no:cacheprovider --noconftest -q

      - name: Archive rules for inspection
        uses: actions/upload-artifact@v6
        with:
          name: prometheus-rules
          path: |
            Scraping_project/monitoring/alerting_rules.yml
            Scraping_project/monitoring/recording_rules.yml
