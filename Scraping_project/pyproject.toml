[project]
name = "scraping-project"
version = "0.1.0"
description = "Multi-stage web scraping and analysis pipeline with Delta Lake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Framework - Scrapy for high-speed crawling
    "scrapy>=2.13.3",

    # Data & State Management - Delta Lake as central nervous system
    "deltalake>=1.1.0",
    "pyarrow>=17.0.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=2.2.0,<3.0.0",

    # Specialized Processing
    "playwright>=1.49.0",  # For JavaScript-heavy pages
    "httpx>=0.28.0",  # Modern HTTP client
    "aiohttp>=3.12.0",  # Async HTTP client for Stage 2 worker

    # Analysis & Utility
    "beautifulsoup4>=4.12.0,<5.0.0",  # HTML parsing
    "lxml>=6.0.0,<7.0.0",  # Fast XML/HTML parsing
    "datasketch>=1.6.0,<2.0.0",  # Efficient similarity detection (Stage 3)
    "yake>=0.6.0",  # Keyword extraction

    # NLP & ML - For large document processing (Stage 4)
    "transformers>=4.50.0",
    "torch>=2.6.0",

    # OCR & Media - For document processing
    "easyocr>=1.7.0",
    "pdf2image>=1.17.0",
    "PyPDF2>=3.0.0",
    "pillow>=11.0.0",

    # Database
    "psycopg2-binary>=2.9.0",  # PostgreSQL adapter
    "redis>=5.0.0",  # Redis for distributed queues and caching

    # Message Queue - Kafka for event streaming
    "confluent-kafka>=2.3.0",  # High-performance Kafka client (librdkafka wrapper)

    # Monitoring
    "prometheus-client>=0.20.0",  # Prometheus metrics exporter

    # Machine Learning
    "scikit-learn>=1.3.0",  # ML for error analysis

    # Utilities
    "pyyaml>=6.0.2",
    "tqdm>=4.65.0,<5.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0,<9.0.0",
    "psutil>=5.9.5,<6.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
    "typing-extensions>=4.12.2",
    "pydantic>=2.0.0,<3.0.0",

    # Data Formats
    "jsonlines>=3.0.0,<5.0.0",
    "itemadapter>=0.12.0",

    # Web Infrastructure
    "requests>=2.32.3",
    "w3lib>=2.3.1",
    "Twisted>=24.7.0",
]

[project.optional-dependencies]
dev = [
    # Development & Testing
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=4.1.0",
    "pytest-html>=3.1.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.3.1",

    # Code Quality
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.13.0",
    "ruff>=0.9.0",

    # Security
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
