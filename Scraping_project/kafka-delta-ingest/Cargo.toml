[package]
name = "kafka-delta-ingest"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kafka client
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl", "zstd"] }

# Delta Lake
deltalake = { version = "0.17", features = ["s3", "datafusion"] }

# Arrow for data processing
arrow = "51"
arrow-schema = "51"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Metrics (StatsD)
cadence = "1.0"

# Environment
dotenv = "0.15"

# AWS S3
aws-config = "1.1"
aws-sdk-s3 = "1.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
