# One formatter path (#357): ruff = lint + import sorting (rule "I" in ruff.toml)
# + formatting (ruff-format, Black-compatible). Black and isort are not used;
# running all three made hooks fight. Config: ruff.toml (see docs/tooling.md).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: ["types-requests", "types-PyYAML"]

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit suite
        entry: pytest tests/unit -q
        language: system
        pass_filenames: false
        stages: [manual]
