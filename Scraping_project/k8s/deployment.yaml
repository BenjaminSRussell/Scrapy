# Minimal Kubernetes manifest (stage1/stage2 workers + Redis).
#
# SUPPORTED INSTALL PATH: the Helm chart in k8s/helm/scraping-pipeline (see
# k8s/README.md). This file is a small quick-start kept at probe parity with
# the chart (#181); it has no Postgres, Kafka, monitoring or network policies.

apiVersion: v1
kind: Namespace
metadata:
  name: uconn-scraper
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scraper-config
  namespace: uconn-scraper
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  DELTA_LAKE_PATH: "/data/delta"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stage1-worker
  namespace: uconn-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stage1-worker
  template:
    metadata:
      labels:
        app: stage1-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: uconn-scraper:latest
        command: ["python", "-m", "src.workers.stage1_worker"]
        envFrom:
        - configMapRef:
            name: scraper-config
        # Probes/preStop mirror the Helm chart (#181). The Helm chart is the
        # supported install path; see k8s/README.md.
        livenessProbe:
          exec:
            command: ["python", "-m", "src.utils.probe", "alive", "src.workers.stage1_worker"]
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["python", "-m", "src.utils.probe", "ready-redis"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              # Give in-flight batches time to finish after SIGTERM is queued.
              command: ["sleep", "10"]
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: scraper-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stage2-worker
  namespace: uconn-scraper
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stage2-worker
  template:
    metadata:
      annotations:  # #789: worker /metrics (src/utils/worker_metrics.py)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9430"
        prometheus.io/path: "/metrics"
      labels:
        app: stage2-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: uconn-scraper:latest
        command: ["python", "-m", "src.workers.stage2_worker"]
        ports:
        - name: metrics
          containerPort: 9430
        envFrom:
        - configMapRef:
            name: scraper-config
        env:
        - name: CONCURRENCY
          value: "10"
        # Probes/preStop mirror the Helm chart (#181). The Helm chart is the
        # supported install path; see k8s/README.md.
        livenessProbe:
          exec:
            command: ["python", "-m", "src.utils.probe", "alive", "src.workers.stage2_worker"]
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["python", "-m", "src.utils.probe", "ready-redis"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              # Give in-flight batches time to finish after SIGTERM is queued.
              command: ["sleep", "10"]
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: scraper-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: uconn-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - --appendonly
        - "yes"
        - --maxmemory
        - "2gb"
        - --maxmemory-policy
        - volatile-lru  # never evict TTL-less seen sets/queues (#161)
        ports:
        - containerPort: 6379
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: uconn-scraper
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scraper-data-pvc
  namespace: uconn-scraper
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: uconn-scraper
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
