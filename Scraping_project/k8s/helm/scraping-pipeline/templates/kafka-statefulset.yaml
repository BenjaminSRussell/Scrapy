{{- if .Values.kafka.enabled }}
{{- $fullname := include "scraping-pipeline.fullname" . }}
{{- $brokers := int (.Values.kafka.replicas | default 1) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-kafka
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ include "scraping-pipeline.fullname" . }}-kafka
  replicas: {{ $brokers }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "scraping-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
        ports:
        - name: internal
          containerPort: 9092
          protocol: TCP
        - name: external
          containerPort: 9093
          protocol: TCP
        - name: jmx
          containerPort: 9999
          protocol: TCP
        {{- if gt $brokers 1 }}
        # Multi-broker (#176): broker.id = pod ordinal, and each broker
        # advertises its own headless-service DNS name so clients reach the
        # partition leader. The single external Service cannot address
        # individual brokers; use the internal listener for multi-broker.
        command:
        - bash
        - -c
        - |
          export KAFKA_BROKER_ID="${HOSTNAME##*-}"
          export KAFKA_ADVERTISED_LISTENERS="INTERNAL://${HOSTNAME}.{{ $fullname }}-kafka:9092,EXTERNAL://{{ $fullname }}-kafka-external:9094"
          exec /etc/confluent/docker/run
        {{- end }}
        env:
        {{- if eq $brokers 1 }}
        - name: KAFKA_BROKER_ID
          value: {{ .Values.kafka.config.brokerId | quote }}
        {{- end }}
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "{{ include "scraping-pipeline.fullname" . }}-zookeeper:2181"
        - name: KAFKA_LISTENERS
          value: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093"
        {{- if eq $brokers 1 }}
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "INTERNAL://{{ $fullname }}-kafka:9092,EXTERNAL://{{ $fullname }}-kafka-external:9094"
        {{- end }}
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_DELETE_TOPIC_ENABLE
          value: "true"
        - name: KAFKA_NUM_PARTITIONS
          value: {{ .Values.kafka.config.numPartitions | quote }}
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: {{ .Values.kafka.config.defaultReplicationFactor | quote }}
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: {{ .Values.kafka.config.minInsyncReplicas | default 1 | quote }}
        - name: KAFKA_LOG_RETENTION_HOURS
          value: {{ .Values.kafka.config.logRetentionHours | quote }}
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: {{ .Values.kafka.config.logSegmentBytes | quote }}
        - name: KAFKA_COMPRESSION_TYPE
          value: {{ .Values.kafka.config.compressionType | quote }}
        - name: KAFKA_HEAP_OPTS
          value: {{ .Values.kafka.config.heapOpts | quote }}
        - name: KAFKA_JMX_PORT
          value: "9999"
        - name: KAFKA_JMX_HOSTNAME
          value: "{{ include "scraping-pipeline.fullname" . }}-kafka"
        # Internal topics follow the data topics' durability (#176).
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: {{ .Values.kafka.config.defaultReplicationFactor | default 1 | quote }}
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: {{ .Values.kafka.config.defaultReplicationFactor | default 1 | quote }}
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: {{ .Values.kafka.config.minInsyncReplicas | default 1 | quote }}
        livenessProbe:
          exec:
            command:
            - kafka-broker-api-versions
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - kafka-broker-api-versions
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          {{- toYaml .Values.kafka.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
  {{- if .Values.kafka.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.kafka.persistence.storageClass }}
      storageClassName: {{ .Values.kafka.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.kafka.persistence.size }}
  {{- else }}
  volumes:
  - name: data
    emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-kafka
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  publishNotReadyAddresses: true
  ports:
  - port: {{ .Values.kafka.service.internal }}
    targetPort: internal
    protocol: TCP
    name: internal
  - port: {{ .Values.kafka.service.jmx }}
    targetPort: jmx
    protocol: TCP
    name: jmx
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-kafka-external
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: {{ .Values.kafka.service.type }}
  ports:
  - port: {{ .Values.kafka.service.external }}
    targetPort: external
    protocol: TCP
    name: external
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
{{- end }}
