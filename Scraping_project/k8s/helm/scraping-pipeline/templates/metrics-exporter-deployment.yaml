{{- if .Values.metricsExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-metrics-exporter
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-exporter
spec:
  replicas: {{ .Values.metricsExporter.replicaCount }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics-exporter
  template:
    metadata:
      labels:
        {{- include "scraping-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics-exporter
    spec:
      containers:
      - name: metrics-exporter
        image: "{{ .Values.metricsExporter.image.repository }}:{{ .Values.metricsExporter.image.tag }}"
        imagePullPolicy: {{ .Values.metricsExporter.image.pullPolicy }}
        command:
        - python
        - metrics_exporter.py
        - --port
        - "{{ .Values.metricsExporter.config.port }}"
        - --interval
        - "{{ .Values.metricsExporter.config.interval }}"
        ports:
        - name: http
          containerPort: {{ .Values.metricsExporter.service.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: {{ if .Values.metricsExporter.mtls.enabled }}/healthz{{ else }}/metrics{{ end }}
            port: http
            {{- if .Values.metricsExporter.mtls.enabled }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: {{ if .Values.metricsExporter.mtls.enabled }}/healthz{{ else }}/metrics{{ end }}
            port: http
            {{- if .Values.metricsExporter.mtls.enabled }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- if .Values.metricsExporter.mtls.enabled }}
        env:
        - name: METRICS_EXPORTER_TLS_CERT
          value: /etc/metrics-exporter/tls/tls.crt
        - name: METRICS_EXPORTER_TLS_KEY
          value: /etc/metrics-exporter/tls/tls.key
        - name: METRICS_EXPORTER_TLS_CA
          value: /etc/metrics-exporter/tls/ca.crt
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "scraping-pipeline.fullname" . }}-app-env
        - secretRef:
            name: {{ .Values.postgresql.auth.existingSecret }}
        {{- if .Values.redis.auth.enabled }}
        - secretRef:  # REDIS_PASSWORD for Redis AUTH (#184)
            name: {{ .Values.redis.auth.existingSecret }}
        {{- end }}
        resources:
          {{- toYaml .Values.metricsExporter.resources | nindent 10 }}
        volumeMounts:
        - name: delta-data
          mountPath: /app/data
        {{- if .Values.metricsExporter.mtls.enabled }}
        - name: metrics-tls
          mountPath: /etc/metrics-exporter/tls
          readOnly: true
        {{- end }}
      volumes:
      - name: delta-data
        persistentVolumeClaim:
          claimName: {{ include "scraping-pipeline.fullname" . }}-delta-lake
      {{- if .Values.metricsExporter.mtls.enabled }}
      - name: metrics-tls
        secret:
          secretName: {{ include "scraping-pipeline.metricsExporterMtlsServerSecret" . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-metrics-exporter
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-exporter
spec:
  type: {{ .Values.metricsExporter.service.type }}
  ports:
  - port: {{ .Values.metricsExporter.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-exporter
{{- end }}
