{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.breakGlass) }}
{{- $fullname := include "scraping-pipeline.fullname" . }}
{{- $metricsStart := int .Values.scrapyApp.service.ports.metricsStart }}
{{- $metricsEnd := int (add (int .Values.scrapyApp.service.ports.metricsEnd) 1) }}  {{- /* int64 -> int for untilStep (#789) */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
{{- range .Values.networkPolicy.policyTypes }}
  - {{ . }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-dns
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-core-egress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - scrapy
      - stage2
      - stage3
      - stage4  # #504
      - delta-ingestor
      - metrics-exporter
      - grafana
      - prometheus
      - kafka-topics  # post-install hook that creates topics (#410)
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: redis
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
  {{- include "scraping-pipeline.redisExternalEgress" . | nindent 2 }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgres
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka
    ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.internal }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: statsd-exporter
    ports:
    - protocol: UDP
      port: {{ .Values.exporters.statsd.service.statsdPort }}
    - protocol: TCP
      port: {{ .Values.exporters.statsd.service.metricsPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus
    ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: alertmanager
    ports:
    - protocol: TCP
      port: {{ .Values.alertmanager.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-prometheus-scrape
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: scrapy
    ports:
{{- range $port := untilStep $metricsStart $metricsEnd 1 }}
    - protocol: TCP
      port: {{ $port }}
{{- end }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: metrics-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.metricsExporter.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: redis-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.redis.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgres-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.postgres.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka-jmx-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.kafkaJmx.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: statsd-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.statsd.service.metricsPort }}
{{- if .Values.workerMetrics.enabled }}
  - to:  # #789: Stage 2/3/4 worker metrics endpoints
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values: [stage2, stage3, stage4]  # stage4: #504
    ports:
    - protocol: TCP
      port: {{ .Values.workerMetrics.port }}
{{- end }}
---
# #789: default-deny also blocks *ingress* on every scrape target, so the
# egress rules above alone left all targets unreachable. Admit Prometheus on
# each target's metrics port(s) only.
{{- $targets := list
      (dict "component" "metrics-exporter" "ports" (list (int .Values.metricsExporter.service.port)))
      (dict "component" "redis-exporter" "ports" (list (int .Values.exporters.redis.service.port)))
      (dict "component" "postgres-exporter" "ports" (list (int .Values.exporters.postgres.service.port)))
      (dict "component" "kafka-jmx-exporter" "ports" (list (int .Values.exporters.kafkaJmx.service.port)))
      (dict "component" "statsd-exporter" "ports" (list (int .Values.exporters.statsd.service.metricsPort))) }}
{{- $scrapyPorts := list }}
{{- range $port := untilStep $metricsStart $metricsEnd 1 }}
{{- $scrapyPorts = append $scrapyPorts $port }}
{{- end }}
{{- $targets = append $targets (dict "component" "scrapy" "ports" $scrapyPorts) }}
{{- if .Values.workerMetrics.enabled }}
{{- if .Values.stage2Worker.enabled }}
{{- $targets = append $targets (dict "component" "stage2" "ports" (list (int .Values.workerMetrics.port))) }}
{{- end }}
{{- if .Values.stage3Worker.enabled }}
{{- $targets = append $targets (dict "component" "stage3" "ports" (list (int .Values.workerMetrics.port))) }}
{{- end }}
{{- if .Values.stage4Worker.enabled }}  {{- /* #504 */}}
{{- $targets = append $targets (dict "component" "stage4" "ports" (list (int .Values.workerMetrics.port))) }}
{{- end }}
{{- end }}
{{- range $t := $targets }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $t.component }}-metrics-ingress
  labels:
    {{- include "scraping-pipeline.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $t.component }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus
    ports:
{{- range $port := $t.ports }}
    - protocol: TCP
      port: {{ $port }}
{{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-redis-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - scrapy
          - stage2
          - stage3
          - stage4  # #504
          - delta-ingestor  # ScrapyMetrics connects before Kafka consume (#190)
          - metrics-exporter
          - redis-exporter
          - grafana  # redis datasource (#190)
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-postgres-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - scrapy
          - stage2
          - stage3
          - stage4  # #504
          - metrics-exporter
          - grafana
          - postgres-exporter  # #190
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-kafka-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - kafka
          - delta-ingestor
          - scrapy
          - stage2
          - stage3
          - stage4  # #504
          - kafka-topics
          - kafka-jmx-exporter  # #190
    ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.internal }}
    - protocol: TCP
      port: {{ .Values.kafka.service.jmx }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-kafka-egress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kafka
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: zookeeper
    ports:
    - protocol: TCP
      port: {{ .Values.zookeeper.service.port }}
  - to:  # broker-to-broker on the internal listener (prod RF>1, #190)
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka
    ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.internal }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-zookeeper-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: zookeeper
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka
    ports:
    - protocol: TCP
      port: {{ .Values.zookeeper.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-alertmanager-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus
    ports:
    - protocol: TCP
      port: {{ .Values.alertmanager.service.port }}
---
# Public crawl only. Private and link-local CIDRs stay closed so this cannot
# reach Redis/Kafka/Postgres or cloud metadata (#190).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-scrape-egress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - scrapy
      - stage2
      - stage3
      - stage4  # #504
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
{{- range .Values.networkPolicy.scrapeExcept }}
        - {{ . }}
{{- end }}
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
---
# Grafana preinstalls redis-datasource (GF_PLUGINS_PREINSTALL on the stock
# grafana/grafana image; the plugin is not baked in). HTTPS only, with the
# same scrapeExcept CIDRs as public crawl egress. Not the whole internet.
# Alertmanager external receivers stay closed (#190).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-grafana-plugin-egress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
{{- range .Values.networkPolicy.scrapeExcept }}
        - {{ . }}
{{- end }}
    ports:
    - protocol: TCP
      port: 443
---
# Exporters dial the store they scrape; default-deny would drop that path (#190).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-exporter-egress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - redis-exporter
      - postgres-exporter
      - kafka-jmx-exporter
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: redis
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
  {{- include "scraping-pipeline.redisExternalEgress" . | nindent 2 }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgres
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka
    ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.jmx }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-statsd-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: statsd-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - scrapy
          - stage2
          - stage3
          - stage4  # #504
          - delta-ingestor
          - metrics-exporter
    ports:
    - protocol: UDP
      port: {{ .Values.exporters.statsd.service.statsdPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-prometheus-query-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: grafana
    ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
{{- if and .Values.stage2Worker.enabled .Values.stage2Worker.autoscaling.enabled .Values.stage2Worker.autoscaling.keda.enabled }}
  # #512: the KEDA operator reads stage2_queue_pending through this Prometheus.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.stage2Worker.autoscaling.keda.operatorNamespace | quote }}
    ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
{{- end }}
---
# Alertmanager replicas gossip on the cluster port (TCP and UDP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-alertmanager-cluster
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: alertmanager
    ports:
    - protocol: TCP
      port: {{ .Values.alertmanager.service.clusterPort }}
    - protocol: UDP
      port: {{ .Values.alertmanager.service.clusterPort }}
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: alertmanager
    ports:
    - protocol: TCP
      port: {{ .Values.alertmanager.service.clusterPort }}
    - protocol: UDP
      port: {{ .Values.alertmanager.service.clusterPort }}
{{- if and .Values.ingress.enabled .Values.grafana.enabled .Values.networkPolicy.ingressNamespace }}
---
# Ingress controller to Grafana. port-forward does not use this (#190).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-grafana-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
    ports:
    - protocol: TCP
      port: {{ .Values.grafana.service.port }}
{{- end }}
{{- end }}
