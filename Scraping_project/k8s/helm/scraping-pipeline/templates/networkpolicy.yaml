{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "scraping-pipeline.fullname" . }}
{{- $metricsStart := int .Values.scrapyApp.service.ports.metricsStart }}
{{- $metricsEnd := int (add (int .Values.scrapyApp.service.ports.metricsEnd) 1) }}  {{- /* int64 -> int for untilStep (#789) */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
{{- range .Values.networkPolicy.policyTypes }}
  - {{ . }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-dns
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-core-egress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - scrapy
      - stage2
      - stage3
      - delta-ingestor
      - metrics-exporter
      - grafana
      - prometheus
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: redis
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgres
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka
    ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.internal }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: statsd-exporter
    ports:
    - protocol: UDP
      port: {{ .Values.exporters.statsd.service.statsdPort }}
    - protocol: TCP
      port: {{ .Values.exporters.statsd.service.metricsPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus
    ports:
    - protocol: TCP
      port: {{ .Values.prometheus.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: alertmanager
    ports:
    - protocol: TCP
      port: {{ .Values.alertmanager.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-prometheus-scrape
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: scrapy
    ports:
{{- range $port := untilStep $metricsStart $metricsEnd 1 }}
    - protocol: TCP
      port: {{ $port }}
{{- end }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: metrics-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.metricsExporter.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: redis-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.redis.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgres-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.postgres.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka-jmx-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.kafkaJmx.service.port }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: statsd-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.exporters.statsd.service.metricsPort }}
{{- if .Values.workerMetrics.enabled }}
  - to:  # #789: Stage 2/3 worker metrics endpoints
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values: [stage2, stage3]
    ports:
    - protocol: TCP
      port: {{ .Values.workerMetrics.port }}
{{- end }}
---
# #789: default-deny also blocks *ingress* on every scrape target, so the
# egress rules above alone left all targets unreachable. Admit Prometheus on
# each target's metrics port(s) only.
{{- $targets := list
      (dict "component" "metrics-exporter" "ports" (list (int .Values.metricsExporter.service.port)))
      (dict "component" "redis-exporter" "ports" (list (int .Values.exporters.redis.service.port)))
      (dict "component" "postgres-exporter" "ports" (list (int .Values.exporters.postgres.service.port)))
      (dict "component" "kafka-jmx-exporter" "ports" (list (int .Values.exporters.kafkaJmx.service.port)))
      (dict "component" "statsd-exporter" "ports" (list (int .Values.exporters.statsd.service.metricsPort))) }}
{{- $scrapyPorts := list }}
{{- range $port := untilStep $metricsStart $metricsEnd 1 }}
{{- $scrapyPorts = append $scrapyPorts $port }}
{{- end }}
{{- $targets = append $targets (dict "component" "scrapy" "ports" $scrapyPorts) }}
{{- if .Values.workerMetrics.enabled }}
{{- if .Values.stage2Worker.enabled }}
{{- $targets = append $targets (dict "component" "stage2" "ports" (list (int .Values.workerMetrics.port))) }}
{{- end }}
{{- if .Values.stage3Worker.enabled }}
{{- $targets = append $targets (dict "component" "stage3" "ports" (list (int .Values.workerMetrics.port))) }}
{{- end }}
{{- end }}
{{- range $t := $targets }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $t.component }}-metrics-ingress
  labels:
    {{- include "scraping-pipeline.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $t.component }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus
    ports:
{{- range $port := $t.ports }}
    - protocol: TCP
      port: {{ $port }}
{{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-redis-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - scrapy
          - stage2
          - stage3
          - metrics-exporter
          - redis-exporter
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-postgres-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - scrapy
          - stage2
          - stage3
          - metrics-exporter
          - grafana
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-kafka-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - kafka
          - delta-ingestor
          - scrapy
          - stage2
          - stage3
    ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.internal }}
    - protocol: TCP
      port: {{ .Values.kafka.service.jmx }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-kafka-egress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kafka
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: zookeeper
    ports:
    - protocol: TCP
      port: {{ .Values.zookeeper.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-zookeeper-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: zookeeper
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: kafka
    ports:
    - protocol: TCP
      port: {{ .Values.zookeeper.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-alertmanager-ingress
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alertmanager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus
    ports:
    - protocol: TCP
      port: {{ .Values.alertmanager.service.port }}
{{- end }}
