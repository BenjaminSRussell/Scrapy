{{- if .Values.prometheus.enabled }}
{{- $root := . }}
{{- $fullname := include "scraping-pipeline.fullname" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-prometheus-config
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.config.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.config.evaluationInterval }}
      external_labels:
        cluster: {{ $fullname | quote }}
        replica: "$(PROMETHEUS_REPLICA)"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - '{{ $fullname }}-alertmanager:{{ .Values.alertmanager.service.port }}'

    rule_files:
      - '/etc/prometheus/recording_rules.yml'
      - '/etc/prometheus/alerting_rules.yml'

    scrape_configs:
      - job_name: 'scrapy_app'
        scrape_interval: 10s
        scrape_timeout: 5s
        static_configs:
          - targets:
{{- range $port := untilStep (int $root.Values.scrapyApp.service.ports.metricsStart) (int $root.Values.scrapyApp.service.ports.metricsEnd) 1 }}
              - '{{ $fullname }}-scrapy:{{ $port }}'
{{- end }}
            labels:
              service: 'scrapy'
              component: 'scraper'
              environment: {{ $root.Values.scrapyApp.env.ENV | quote }}

      - job_name: 'scraping_pipeline'
        scrape_interval: {{ .Values.prometheus.config.scrapeInterval }}
        scrape_timeout: 3s
        static_configs:
          - targets:
              - '{{ $fullname }}-metrics-exporter:{{ .Values.metricsExporter.service.port }}'
            labels:
              service: 'pipeline'
              component: 'metrics'

      - job_name: 'redis'
        static_configs:
          - targets:
              - '{{ $fullname }}-redis-exporter:{{ .Values.exporters.redis.service.port }}'
            labels:
              service: 'redis'

      - job_name: 'postgres'
        static_configs:
          - targets:
              - '{{ $fullname }}-postgres-exporter:{{ .Values.exporters.postgres.service.port }}'
            labels:
              service: 'postgres'

      - job_name: 'kafka_jmx'
        scrape_interval: 10s
        scrape_timeout: 5s
        static_configs:
          - targets:
              - '{{ $fullname }}-kafka-jmx-exporter:{{ .Values.exporters.kafkaJmx.service.port }}'
            labels:
              service: 'kafka'
              component: 'broker'

      - job_name: 'statsd'
        scrape_interval: 10s
        scrape_timeout: 5s
        static_configs:
          - targets:
              - '{{ $fullname }}-statsd-exporter:{{ .Values.exporters.statsd.service.metricsPort }}'
            labels:
              service: 'ingestor'
              component: 'metrics'

  recording_rules.yml: |
{{ (.Files.Get "files/monitoring/recording_rules.yml") | indent 4 }}
  alerting_rules.yml: |
{{ (.Files.Get "files/monitoring/alerting_rules.yml") | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-prometheus
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  ports:
  - port: {{ .Values.prometheus.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-prometheus
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  serviceName: {{ $fullname }}-prometheus
  replicas: {{ .Values.prometheus.replicas }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "scraping-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      containers:
      - name: prometheus
        image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
        imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time={{ .Values.prometheus.config.retentionTime }}"
        - "--web.enable-lifecycle"
        - "--web.enable-admin-api"
        ports:
        - name: http
          containerPort: {{ .Values.prometheus.service.port }}
          protocol: TCP
        env:
        - name: PROMETHEUS_REPLICA
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        resources:
          {{- toYaml .Values.prometheus.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ $fullname }}-prometheus-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      {{- if .Values.prometheus.persistence.storageClass }}
      storageClassName: {{ .Values.prometheus.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.prometheus.persistence.size }}
{{- end }}
