{{- if and .Values.scrapyApp.enabled .Values.scrapyApp.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-scrapy
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: scrapy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "scraping-pipeline.fullname" . }}-scrapy
  minReplicas: {{ .Values.scrapyApp.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.scrapyApp.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.scrapyApp.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
