{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-postgresql-init
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init-db.sql: |
{{ (.Files.Get "files/init-db.sql") | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-postgresql
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
  - port: {{ .Values.postgresql.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-postgresql
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "scraping-pipeline.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "scraping-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
      - name: postgresql
        image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
        imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
        ports:
        - name: postgres
          containerPort: {{ .Values.postgresql.service.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "scraping-pipeline.fullname" . }}-app-env
        - secretRef:
            name: {{ .Values.postgresql.auth.existingSecret }}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret }}
              key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - >
              pg_isready --host=127.0.0.1 --port={{ .Values.postgresql.service.port }} --dbname={{ .Values.postgresql.auth.database }} --username={{ .Values.postgresql.auth.username }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - >
              pg_isready --host=127.0.0.1 --port={{ .Values.postgresql.service.port }} --dbname={{ .Values.postgresql.auth.database }} --username={{ .Values.postgresql.auth.username }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        resources:
          {{- toYaml .Values.postgresql.resources | nindent 10 }}
      volumes:
      - name: initdb
        configMap:
          name: {{ include "scraping-pipeline.fullname" . }}-postgresql-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      {{- if .Values.postgresql.persistence.storageClass }}
      storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
