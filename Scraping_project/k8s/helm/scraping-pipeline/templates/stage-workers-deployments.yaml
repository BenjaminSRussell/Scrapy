{{- if .Values.stage2Worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-stage2
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: stage2
    app: stage2-worker
spec:
  replicas: {{ .Values.stage2Worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stage2
      app: stage2-worker
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        {{- include "scraping-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stage2
        app: stage2-worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.stage2Worker.terminationGracePeriodSeconds }}
      containers:
      - name: stage2-worker
        image: "{{ .Values.stage2Worker.image.repository }}:{{ .Values.stage2Worker.image.tag }}"
        imagePullPolicy: {{ .Values.stage2Worker.image.pullPolicy }}
        command: ["python", "-u", "src/stage2/stage2_worker.py"]
        envFrom:
        - configMapRef:
            name: {{ include "scraping-pipeline.fullname" . }}-app-env
        - secretRef:
            name: {{ .Values.postgresql.auth.existingSecret }}
        {{- if .Values.redis.auth.enabled }}
        - secretRef:  # REDIS_PASSWORD for Redis AUTH (#184)
            name: {{ .Values.redis.auth.existingSecret }}
        {{- end }}
        env:
        - name: QUEUE_NAME
          value: {{ .Values.stage2Worker.queueName | quote }}
        livenessProbe:
          exec:
            command:
            # stdlib-only probe: the slim image lacks procps (#181)
            - python
            - -m
            - src.utils.probe
            - alive
            - stage2_worker.py
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -c "import os,socket; socket.create_connection((os.environ.get('POSTGRES_HOST','localhost'), int(os.environ.get('POSTGRES_PORT','5432'))), 5)"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - python -c "import sys; sys.path.insert(0, '/app'); from drain_lake import LakeDrainer; LakeDrainer().drain_transient_queues()" || true; sleep 10
        resources:
          {{- toYaml .Values.stage2Worker.resources | nindent 10 }}
        volumeMounts:
        - name: delta-data
          mountPath: /app/data
      volumes:
      - name: delta-data
        persistentVolumeClaim:
          claimName: {{ include "scraping-pipeline.fullname" . }}-delta-lake
{{- end }}

