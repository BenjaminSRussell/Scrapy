{{- if .Values.alertmanager.enabled }}
{{- $root := . }}
{{- $fullname := include "scraping-pipeline.fullname" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-alertmanager-config
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
data:
  alertmanager.yml: |
{{ (.Files.Get "files/monitoring/alertmanager.yml") | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-alertmanager
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  type: {{ .Values.alertmanager.service.type }}
  ports:
  - port: {{ .Values.alertmanager.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-alertmanager-headless
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  clusterIP: None
  ports:
  - port: {{ .Values.alertmanager.service.clusterPort }}
    targetPort: cluster
    protocol: TCP
    name: cluster
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-alertmanager
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  serviceName: {{ $fullname }}-alertmanager-headless
  replicas: {{ .Values.alertmanager.replicas }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: alertmanager
  template:
    metadata:
      labels:
        {{- include "scraping-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
        imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
        args:
        - "--config.file=/etc/alertmanager/alertmanager.yml"
        - "--storage.path=/alertmanager"
        - "--data.retention=120h"
        - "--cluster.listen-address=0.0.0.0:{{ .Values.alertmanager.service.clusterPort }}"
{{- range $i, $e := until (int .Values.alertmanager.replicas) }}
{{- $peer := printf "%s-alertmanager-%d.%s-alertmanager-headless:%d" $fullname $i $fullname $root.Values.alertmanager.service.clusterPort }}
        - "--cluster.peer={{ $peer }}"
{{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.alertmanager.service.port }}
          protocol: TCP
        - name: cluster
          containerPort: {{ .Values.alertmanager.service.clusterPort }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: data
          mountPath: /alertmanager
        resources:
          {{- toYaml .Values.alertmanager.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ $fullname }}-alertmanager-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      {{- if .Values.alertmanager.persistence.storageClass }}
      storageClassName: {{ .Values.alertmanager.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.alertmanager.persistence.size }}
{{- end }}
