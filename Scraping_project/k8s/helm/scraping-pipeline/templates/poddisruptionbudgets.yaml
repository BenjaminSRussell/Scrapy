{{- if .Values.podDisruptionBudget.enabled }}
{{- $root := . }}
{{- $pdb := .Values.podDisruptionBudget }}
{{- /*
  #514. Stateful stores: minAvailable only when there's a replica to spare. Postgres
  and Redis run `replicas: 1` (hard-coded in their StatefulSets), and there
  minAvailable: 1 would forbid every eviction and hang node drains forever, so a
  single replica gets maxUnavailable: 1 (drain proceeds, one pod at a time).
  Kafka's broker count is kafka.replicas (#176); it is declared 1 here on purpose so
  it always gets maxUnavailable: 1: one broker at a time keeps min.insync.replicas
  satisfied when RF = minISR + 1, whatever the broker count.
  Keep `replicas` below in sync with the StatefulSets (a unit test checks this).
*/}}
{{- $stores := list
      (dict "enabled" .Values.postgresql.enabled "name" "postgresql" "component" "postgres" "replicas" 1)
      (dict "enabled" .Values.redis.enabled "name" "redis" "component" "redis" "replicas" 1)
      (dict "enabled" .Values.kafka.enabled "name" "kafka" "component" "kafka" "replicas" 1) }}
{{- range $s := $stores }}
{{- if $s.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "scraping-pipeline.fullname" $root }}-{{ $s.name }}-pdb
  labels:
    {{- include "scraping-pipeline.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $s.component }}
spec:
  {{- if gt (int $s.replicas) 1 }}
  minAvailable: {{ $pdb.minAvailable | default 1 }}
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $s.component }}
{{- end }}
{{- end }}
{{- /*
  Scraper and stage workers (#514): maxUnavailable, so even a single replica can
  be drained (its preStop hook drains transient queues first), one pod at a time,
  and a node drain never takes a whole stage down at once when replicas > 1.
*/}}
{{- $workers := list
      (dict "values" .Values.scrapyApp "component" "scrapy")
      (dict "values" .Values.stage2Worker "component" "stage2")
      (dict "values" .Values.stage3Worker "component" "stage3")
      (dict "values" .Values.stage4Worker "component" "stage4") }}
{{- range $w := $workers }}
{{- if $w.values.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "scraping-pipeline.fullname" $root }}-{{ $w.component }}-pdb
  labels:
    {{- include "scraping-pipeline.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $w.component }}
spec:
  maxUnavailable: {{ $pdb.workers.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $w.component }}
{{- end }}
{{- end }}
{{- end }}
