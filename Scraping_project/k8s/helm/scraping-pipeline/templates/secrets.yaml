{{- if not .Values.secrets.useExternalSecrets }}
{{- $postgresHost := printf "%s-postgresql" (include "scraping-pipeline.fullname" .) }}
{{- $postgresPort := int .Values.postgresql.service.port }}{{/* YAML numbers are float64: %d printed "%!d(float64=5432)" */}}
{{- $postgresDb := .Values.postgresql.auth.database }}
{{- $postgresUser := .Values.postgresql.auth.username }}
{{- $postgresPassword := .Values.secrets.postgres.password }}
{{- $grafanaAdminPassword := .Values.secrets.grafana.adminPassword }}
{{- $appUser := .Values.postgresql.auth.appUsername | default "" }}
{{- $appPassword := .Values.secrets.postgres.appPassword | default "" }}
{{- if $appUser }}
  {{- if or (eq $appPassword "") (eq $appPassword $postgresPassword) (has $appPassword (list "changeme" "postgres" "scrapy_app" "scrapy_app_dev")) }}
    {{- fail "SECURITY ERROR: postgresql.auth.appUsername is set, so secrets.postgres.appPassword must be a secure password that differs from the superuser password (#538)." }}
  {{- end }}
{{- end }}
{{- $dbUser := ternary $appUser $postgresUser (ne $appUser "") }}
{{- $dbPassword := ternary $appPassword $postgresPassword (ne $appUser "") }}

{{- /* SECURITY: Fail deployment if passwords are empty or default insecure values */ -}}
{{- if or (eq $postgresPassword "") (eq $postgresPassword "changeme") (eq $postgresPassword "postgres") }}
  {{- fail "SECURITY ERROR: PostgreSQL password is empty or uses an insecure default value. You MUST provide a secure password via --set secrets.postgres.password=<YOUR_SECURE_PASSWORD> or use external secrets (useExternalSecrets=true)." }}
{{- end }}
{{- if and .Values.redis.auth.enabled (or (eq (.Values.secrets.redis.password | default "") "") (eq (.Values.secrets.redis.password | default "") "redis")) }}
  {{- fail "SECURITY ERROR: Redis AUTH is enabled but the password is empty or insecure. Provide --set secrets.redis.password=<YOUR_SECURE_PASSWORD>, use external secrets (useExternalSecrets=true), or explicitly disable AUTH with redis.auth.enabled=false (isolated dev clusters only)." }}
{{- end }}
{{- if or (eq $grafanaAdminPassword "") (eq $grafanaAdminPassword "admin") }}
  {{- fail "SECURITY ERROR: Grafana admin password is empty or uses the insecure default 'admin'. You MUST provide a secure password via --set secrets.grafana.adminPassword=<YOUR_SECURE_PASSWORD> or use external secrets (useExternalSecrets=true)." }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
  annotations:
    description: "PostgreSQL credentials - automatically generated from Helm values"
type: Opaque
data:
  password: {{ $postgresPassword | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | b64enc | quote }}
  DB_PASSWORD: {{ $dbPassword | b64enc | quote }}
  {{- if $appUser }}
  APP_DB_PASSWORD: {{ $appPassword | b64enc | quote }}
  {{- end }}
  DATA_SOURCE_NAME: {{ printf "postgresql://%s:%s@%s:%d/%s?sslmode=disable" $postgresUser $postgresPassword $postgresHost $postgresPort $postgresDb | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" $dbUser $dbPassword $postgresHost $postgresPort $postgresDb | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
  annotations:
    description: "Grafana admin credentials - automatically generated from Helm values"
type: Opaque
data:
  admin-user: {{ .Values.secrets.grafana.adminUser | b64enc | quote }}
  admin-password: {{ $grafanaAdminPassword | b64enc | quote }}
{{- if .Values.redis.auth.enabled }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.auth.existingSecret }}
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
  annotations:
    description: "Redis AUTH password - automatically generated from Helm values (#184)"
type: Opaque
data:
  {{ .Values.redis.auth.passwordKey }}: {{ .Values.secrets.redis.password | b64enc | quote }}
{{- end }}
{{- else }}
---
# When useExternalSecrets is true, we expect secrets to be provided externally.
# This could be via:
#   - Manual creation: kubectl create secret ...
#   - External Secrets Operator
#   - Sealed Secrets
#   - Cloud provider secrets managers (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault)
#
# Required secrets:
#   - postgres-credentials (with keys: password, POSTGRES_PASSWORD, DB_PASSWORD, DATA_SOURCE_NAME, DATABASE_URL;
#     plus APP_DB_PASSWORD when postgresql.auth.appUsername is set, with DB_PASSWORD = that app password, #538)
#   - grafana-credentials (with keys: admin-user, admin-password)
#   - redis-credentials (with key: REDIS_PASSWORD) when redis.auth.enabled
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-secrets-info
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
data:
  README: |
    External secrets mode is enabled (useExternalSecrets=true).

    The following secrets must be created before the application can start:

    1. postgres-credentials
       Required keys: password, POSTGRES_PASSWORD, DB_PASSWORD, DATA_SOURCE_NAME, DATABASE_URL
       {{- if .Values.postgresql.auth.appUsername }}
       Least-privilege app role {{ .Values.postgresql.auth.appUsername }} (#538): also APP_DB_PASSWORD,
       and DB_PASSWORD must equal APP_DB_PASSWORD (the app connects as that role).
       {{- end }}

    2. grafana-credentials
       Required keys: admin-user, admin-password

    3. redis-credentials (when redis.auth.enabled, the default)
       Required keys: REDIS_PASSWORD

    Example manual creation:
      kubectl create secret generic postgres-credentials \
        --from-literal=password=<YOUR_SECURE_PASSWORD> \
        --from-literal=POSTGRES_PASSWORD=<YOUR_SECURE_PASSWORD> \
        --from-literal=DB_PASSWORD=<YOUR_SECURE_PASSWORD>

      kubectl create secret generic grafana-credentials \
        --from-literal=admin-user=admin \
        --from-literal=admin-password=<YOUR_SECURE_PASSWORD>

      kubectl create secret generic redis-credentials \
        --from-literal=REDIS_PASSWORD=<YOUR_SECURE_PASSWORD>
{{- end }}
