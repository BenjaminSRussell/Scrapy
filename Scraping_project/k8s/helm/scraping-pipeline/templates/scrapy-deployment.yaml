{{- if .Values.scrapyApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-scrapy
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: scrapy
    app: scrapy-runner
spec:
  replicas: {{ .Values.scrapyApp.replicaCount }}
  selector:
    matchLabels:
      {{- include "scraping-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scrapy
      app: scrapy-runner
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9410"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "scraping-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scrapy
        app: scrapy-runner
    spec:
      terminationGracePeriodSeconds: {{ .Values.scrapyApp.terminationGracePeriodSeconds }}
      containers:
      - name: scrapy
        image: "{{ .Values.scrapyApp.image.repository }}:{{ .Values.scrapyApp.image.tag }}"
        imagePullPolicy: {{ .Values.scrapyApp.image.pullPolicy }}
        command: ["python", "run_multiple_scouts.py"]
        ports:
        {{- range $port := untilStep (int .Values.scrapyApp.service.ports.metricsStart) (int .Values.scrapyApp.service.ports.metricsEnd) 1 }}
        - name: metrics-{{ $port }}
          containerPort: {{ $port }}
          protocol: TCP
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "scraping-pipeline.fullname" . }}-app-env
        - secretRef:
            name: {{ .Values.postgresql.auth.existingSecret }}
        env:

        - name: SCOUT_INSTANCES
          value: {{ .Values.scrapyApp.env.SCOUT_INSTANCES | quote }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f run_multiple_scouts.py
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - python -c "import os,socket; socket.create_connection((os.environ.get('REDIS_HOST','localhost'), int(os.environ.get('REDIS_PORT','6379'))), 5)"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - python -c "import sys; sys.path.insert(0, '/app'); from drain_lake import LakeDrainer; LakeDrainer().drain_transient_queues()" || true; sleep 10
        resources:
          {{- toYaml .Values.scrapyApp.resources | nindent 10 }}
        volumeMounts:
        - name: delta-data
          mountPath: /app/data
      volumes:
      - name: delta-data
        persistentVolumeClaim:
          claimName: {{ include "scraping-pipeline.fullname" . }}-delta-lake
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scraping-pipeline.fullname" . }}-scrapy
  labels:
    {{- include "scraping-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: scrapy
    app: scrapy-runner
spec:
  type: {{ .Values.scrapyApp.service.type }}
  ports:
  {{- range $port := untilStep (int .Values.scrapyApp.service.ports.metricsStart) (int .Values.scrapyApp.service.ports.metricsEnd) 1 }}
  - port: {{ $port }}
    targetPort: metrics-{{ $port }}
    protocol: TCP
    name: metrics-{{ $port }}
  {{- end }}
  selector:
    {{- include "scraping-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scrapy
    app: scrapy-runner
{{- end }}
