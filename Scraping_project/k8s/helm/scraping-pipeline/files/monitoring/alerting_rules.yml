# ==================================================================
# Prometheus Alerting Rules for Scrapy Pipeline
# ==================================================================
# These rules define alerts for critical conditions in the pipeline
# Alerts are sent to Alertmanager for routing and notification
# ==================================================================

groups:
  # ============================================
  # Kafka Infrastructure Alerts
  # ============================================
  - name: kafka_infrastructure
    interval: 30s
    rules:
      # Critical: Kafka broker is down
      - alert: KafkaBrokerDown
        expr: up{job="kafka_jmx"} == 0
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka broker is down"
          description: "Kafka broker has been down for more than 1 minute. This will halt all real-time data ingestion."
          impact: "Critical - No new data can be published to Kafka"
          action: "Check Kafka broker logs: docker-compose logs kafka"

      # Critical: Multiple active controllers (split brain)
      - alert: KafkaMultipleControllers
        expr: kafka_controller_activecontrollercount > 1
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Multiple Kafka controllers detected"
          description: "Kafka has {{ $value }} active controllers. Should only have 1."
          impact: "Critical - Potential split-brain condition"
          action: "Restart Kafka cluster in controlled manner"

      # Critical: No active controller
      - alert: KafkaNoActiveController
        expr: kafka_controller_activecontrollercount < 1
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "No active Kafka controller"
          description: "Kafka cluster has no active controller."
          impact: "Critical - Cluster cannot function without controller"
          action: "Check Zookeeper connectivity and Kafka broker logs"

      # Critical: Under-replicated partitions
      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_server_replicamanager_underreplicatedpartitions > 0
        for: 5m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka has under-replicated partitions"
          description: "{{ $value }} partitions are under-replicated."
          impact: "High - Data may be at risk if broker fails"
          action: "Check broker health and network connectivity"

      # Critical: Offline partitions
      - alert: KafkaOfflinePartitions
        expr: kafka_controller_offlinepartitionscount > 0
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka has offline partitions"
          description: "{{ $value }} partitions are offline."
          impact: "Critical - Data loss or unavailability"
          action: "Immediate investigation required. Check broker logs."

      # Warning: High consumer lag
      - alert: KafkaHighConsumerLag
        expr: kafka_consumer_records_lag > 10000
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "High Kafka consumer lag detected"
          description: "Consumer {{ $labels.client_id }} has lag of {{ $value }} messages on topic {{ $labels.topic }}."
          impact: "Medium - Data processing delayed"
          action: "Scale up consumers or investigate processing bottleneck"

      # Warning: Very high consumer lag (critical threshold)
      - alert: KafkaVeryHighConsumerLag
        expr: kafka_consumer_records_lag > 100000
        for: 5m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Very high Kafka consumer lag"
          description: "Consumer {{ $labels.client_id }} has lag of {{ $value }} messages."
          impact: "High - Significant data processing backlog"
          action: "Immediate action: scale consumers or pause producers"

  # ============================================
  # Scrapy Application Alerts
  # ============================================
  - name: scrapy_application
    interval: 30s
    rules:
      # Critical: Scrapy app is down
      - alert: ScrapyAppDown
        expr: up{job="scrapy_app"} == 0
        for: 2m
        labels:
          severity: critical
          component: scrapy
        annotations:
          summary: "Scrapy application is down"
          description: "Scrapy app has been unreachable for more than 2 minutes."
          impact: "Critical - No web scraping is occurring"
          action: "Check Scrapy container: docker-compose logs scrapy-app"

      # Warning: No items being scraped
      - alert: ScrapyNoItemsScraped
        expr: rate(scrapy_items_scraped_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
          component: scrapy
        annotations:
          summary: "Scrapy is not scraping items"
          description: "No items scraped in the past 10 minutes."
          impact: "Medium - Data freshness impacted"
          action: "Check spider configuration and target website availability"

      # Warning: High error rate
      - alert: ScrapyHighErrorRate
        expr: |
          (
            sum(rate(scrapy_responses_total{status_code=~"[45].."}[5m]))
            /
            sum(rate(scrapy_responses_total[5m]))
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          component: scrapy
        annotations:
          summary: "Scrapy high HTTP error rate"
          description: "More than 20% of responses are HTTP errors."
          impact: "Medium - Crawling efficiency reduced"
          action: "Inspect failing URLs and adjust crawl policies"

      # Critical: Scrapy high error rate
      - alert: ScrapyCriticalErrorRate
        expr: |
          (
            sum(rate(scrapy_responses_total{status_code=~"[45].."}[5m]))
            /
            sum(rate(scrapy_responses_total[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: critical
          component: scrapy
        annotations:
          summary: "Scrapy critical error rate"
          description: "More than 50% of responses are HTTP errors."
          impact: "High - Crawling halted or blocked"
          action: "Investigate block detection, update user-agents, or throttle requests"

      # Warning: Slow response times
      - alert: ScrapySlowResponses
        expr: histogram_quantile(0.95, rate(scrapy_response_time_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
          component: scrapy
        annotations:
          summary: "Scrapy response time p95 > 3s"
          description: "95th percentile response time is above 3 seconds."
          impact: "Medium - Crawling throughput reduced"
          action: "Check target site speed and network conditions"

  # ============================================
  # Pipeline Throughput & Quality Alerts
  # ============================================
  - name: pipeline_throughput
    interval: 1m
    rules:
      # Warning: Pipeline throughput dropped significantly
      - alert: PipelineThroughputDegraded
        expr: |
          (
            sum(rate(scrapy_items_scraped_total[5m]))
            /
            sum(rate(scrapy_items_scraped_total[30m]))
          ) < 0.5
        for: 10m
        labels:
          severity: warning
          component: pipeline
        annotations:
          summary: "Pipeline throughput dropped by more than 50%"
          description: "Current throughput is {{ $value | humanizePercentage }} of 30-minute average."
          impact: "Medium - Data ingestion slowing down"
          action: "Investigate upstream and downstream components for bottlenecks"

      # Critical: No Delta Lake commits
      - alert: NoDeltaCommits
        expr: rate(ingestor_delta_commits_total[15m]) == 0
        for: 30m
        labels:
          severity: critical
          component: delta
        annotations:
          summary: "No Delta Lake commits in 30 minutes"
          description: "Data is not being persisted to Delta Lake."
          impact: "High - Data pipeline blocked"
          action: "Check kafka-delta-ingestor logs and Kafka connectivity"

      # Warning: High Delta Lake write latency
      - alert: DeltaHighWriteLatency
        expr: histogram_quantile(0.95, rate(delta_batch_write_seconds_bucket[5m])) > 10
        for: 10m
        labels:
          severity: warning
          component: delta
        annotations:
          summary: "Delta Lake write latency p95 > 10s"
          description: "95th percentile Delta Lake write latency exceeded threshold."
          impact: "Medium - Slow data persistence"
          action: "Investigate storage performance and network throughput"

  # ============================================
  # Infrastructure Alerts (Redis/Postgres)
  # ============================================
  - name: infrastructure
    interval: 30s
    rules:
      # Critical: Redis is down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for more than 1 minute."
          impact: "Critical - Queue system and circuit breakers offline"
          action: "Restart Redis: docker-compose restart redis"

      # Warning: High Redis memory usage
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory."
          impact: "Medium - Risk of evictions or OOM"
          action: "Review queue sizes and consider scaling Redis"

      # Critical: PostgreSQL is down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been unreachable for more than 1 minute."
          impact: "High - Metrics storage offline"
          action: "Restart PostgreSQL: docker-compose restart postgres"

      # Warning: High PostgreSQL connection usage
      - alert: PostgresHighConnections
        expr: |
          pg_stat_database_numbackends
          /
          pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: "PostgreSQL connection usage high"
          description: "PostgreSQL is using {{ $value | humanizePercentage }} of max connections."
          impact: "Medium - Risk of connection exhaustion"
          action: "Review connection pooling and close idle connections"

  # ============================================
  # Prometheus & Monitoring Alerts
  # ============================================
  - name: monitoring
    interval: 1m
    rules:
      # Warning: Prometheus is approaching storage capacity
      - alert: PrometheusStorageNearFull
        expr: |
          (1 - (prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes)) < 0.1
        for: 30m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus storage nearly full"
          description: "Prometheus has less than 10% storage available."
          impact: "Medium - Risk of data loss"
          action: "Increase retention limit or reduce scrape frequency"

      # Critical: Prometheus scrape failures
      - alert: PrometheusScrapeFailures
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus cannot scrape target"
          description: "Target {{ $labels.job }} ({{ $labels.instance }}) is unreachable."
          impact: "Medium - Missing metrics for this target"
          action: "Check target health and network connectivity"

  # ============================================
  # Business Logic / Data Quality Alerts
  # ============================================
  - name: data_quality
    interval: 1m
    rules:
      # Warning: Scraping throughput significantly decreased
      - alert: ScrapingThroughputDropped
        expr: |
          (
            sum(rate(scrapy_items_scraped_total[5m]))
            /
            sum(rate(scrapy_items_scraped_total[5m] offset 1h))
          ) < 0.5
        for: 15m
        labels:
          severity: warning
          component: pipeline
        annotations:
          summary: "Scraping throughput has dropped significantly"
          description: "Current throughput is {{ $value | humanizePercentage }} of 1 hour ago."
          impact: "Medium - Reduced data collection rate"
          action: "Investigate spider performance and target site availability"

      # Info: Circuit breakers open
      - alert: CircuitBreakersOpen
        expr: circuit_breaker_open_count > 0
        for: 10m
        labels:
          severity: info
          component: pipeline
        annotations:
          summary: "Circuit breakers are open"
          description: "{{ $value }} circuit breakers are currently open."
          impact: "Low - Some domains are temporarily blocked"
          action: "Normal operation - circuits will auto-recover"

      # Warning: Low Delta Lake write rate
      - alert: LowDeltaLakeWrites
        expr: rate(ingestor_delta_commits_total[5m]) == 0
        for: 15m
        labels:
          severity: warning
          component: ingestor
        annotations:
          summary: "No Delta Lake commits in 15 minutes"
          description: "No data is being written to Delta Lake."
          impact: "Medium - Data persistence stalled"
          action: "Check Kafka consumer and Delta Lake connectivity"
