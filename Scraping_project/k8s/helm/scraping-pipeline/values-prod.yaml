# Production overrides (#176, #233, #451, #190). Use together with values.yaml:
#
#   helm upgrade --install scraping-pipeline . -f values.yaml -f values-prod.yaml \
#     --set ingress.hosts[0].host=grafana.example.edu \
#     --set ingress.tls[0].hosts[0]=grafana.example.edu
#
# profile: production makes templates/validate.yaml fail the render when:
#   - Kafka replication factor < 2, or min.insync.replicas >= replication factor
#     would block writes on a single broker loss (needs RF >= minISR + 1);
#   - Grafana is a LoadBalancer without grafana.service.allowPublicLoadBalancer;
#   - the ingress is enabled without TLS;
#   - networkPolicy is off without networkPolicy.breakGlass (#190);
#   - Redis is still the chart's single replica, or redis.external.host is empty.
#     Replace the host and egressCIDRs below before a real install (#216).
#     AOF can recover data after the node returns, and it does not keep the
#     queue available during node loss.
profile: production

kafka:
  replicas: 3
  config:
    defaultReplicationFactor: 3
    minInsyncReplicas: 2

grafana:
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: grafana.example.edu
      paths:
        - path: /grafana(/|$)(.*)
          pathType: Prefix
          service: grafana
          port: 3000
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.example.edu

# Default-deny for Redis, Kafka, Postgres and the scrapers (#190).
# Break-glass (debug only; do not leave on): --set networkPolicy.breakGlass=true
# kubectl port-forward is not blocked by NetworkPolicy.
networkPolicy:
  enabled: true
  breakGlass: false
  # Ingress controller namespace (className nginx above). Change if yours differs.
  ingressNamespace: ingress-nginx

# #216: do not deploy the single-replica chart Redis. Point the existing
# REDIS_HOST / REDIS_PORT contract at a managed Redis or the stable hostname
# in front of a Sentinel/HA primary you run outside this chart. Password stays
# REDIS_PASSWORD in redis-credentials. Do not set REDIS_URL.
# Replace redis.example.edu and the documentation CIDR (TEST-NET-3, RFC 5737)
# before install. NetworkPolicy is on above and cannot match a DNS name.
# Queue and seen-set soft limits for this external server are the application
# defaults documented on redis.capacity in values.yaml (queue depth 10000,
# low watermark 8000, no seen-set member cap). See Scraping_project/docs/REDIS_CAPACITY.md
# (#264). This overlay does not set those knobs and does not set REDIS_URL.
redis:
  enabled: false
  external:
    host: redis.example.edu
    port: 6379
    egressCIDRs:
      - 203.0.113.0/24
