apiVersion: 1

datasources:
  # The ops-prometheus service in docker-compose.observability.yml. The uid
  # matches the dashboards' ${datasource} default (prometheus).
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://ops-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
