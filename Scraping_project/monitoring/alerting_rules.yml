# ==================================================================
# Prometheus Alerting Rules for Scrapy Pipeline
# ==================================================================
# These rules define alerts for critical conditions in the pipeline
# Alerts are sent to Alertmanager for routing and notification
#
# Every metric an expr reads must have a real producer (#178). The sources:
#   - Python prometheus_client metrics defined in src/ (scrapy_*, delta_*,
#     redis_pool_*, scrapy_pg_*, ...), scraped on the scrapy_app job
#   - recording_rules.yml outputs (e.g. kafka_consumergroup_lag_max)
#   - statsd-exporter, via k8s/helm/.../files/monitoring/statsd_mapping.yml:
#     kafka-delta-ingest (kafka_delta_ingest_*) and monitoring/metrics_exporter.py
#     (redis_queue_length, pipeline_errors_total, circuit_breaker_open_count)
#   - kafka JMX exporter names from files/monitoring/kafka_jmx_config.yml
#   - redis_exporter, postgres_exporter, Prometheus' own metrics and `up`
# tests/unit/monitoring/test_alert_metric_catalog.py fails CI when an expr
# names a metric none of these produce. The Helm copy of this file must be
# identical (same test).
# ==================================================================

groups:
  # ============================================
  # Kafka Infrastructure Alerts
  # ============================================
  - name: kafka_infrastructure
    interval: 30s
    rules:
      # Critical: Kafka broker is down
      - alert: KafkaBrokerDown
        expr: up{job="kafka_jmx"} == 0
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka broker is down"
          description: "Kafka broker has been down for more than 1 minute. This will halt all real-time data ingestion."
          impact: "Critical - No new data can be published to Kafka"
          action: "Check Kafka broker logs: docker-compose logs kafka"

      # Critical: Multiple active controllers (split brain)
      - alert: KafkaMultipleControllers
        expr: kafka_controller_activecontrollercount > 1
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Multiple Kafka controllers detected"
          description: "Kafka has {{ $value }} active controllers. Should only have 1."
          impact: "Critical - Potential split-brain condition"
          action: "Restart Kafka cluster in controlled manner"

      # Critical: No active controller
      - alert: KafkaNoActiveController
        expr: kafka_controller_activecontrollercount < 1
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "No active Kafka controller"
          description: "Kafka cluster has no active controller."
          impact: "Critical - Cluster cannot function without controller"
          action: "Check Zookeeper connectivity and Kafka broker logs"

      # Critical: Under-replicated partitions
      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_server_replicamanager_underreplicatedpartitions > 0
        for: 5m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka has under-replicated partitions"
          description: "{{ $value }} partitions are under-replicated."
          impact: "High - Data may be at risk if broker fails"
          action: "Check broker health and network connectivity"

      # Critical: Offline partitions
      - alert: KafkaOfflinePartitions
        expr: kafka_controller_offlinepartitionscount > 0
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka has offline partitions"
          description: "{{ $value }} partitions are offline."
          impact: "Critical - Data loss or unavailability"
          action: "Immediate investigation required. Check broker logs."

      # Warning: High consumer lag
      - alert: KafkaHighConsumerLag
        expr: max_over_time(kafka_consumergroup_lag_max[5m]) > 10000
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "High Kafka consumer group lag detected"
          description: "Consumer group {{ $labels.group }} on topic {{ $labels.topic }} has a max lag of {{ $value }} messages on at least one partition."
          impact: "Medium - Data processing delayed"
          action: "Scale up consumers or investigate processing bottleneck"

      # Warning: Very high consumer lag (critical threshold)
      - alert: KafkaVeryHighConsumerLag
        expr: max_over_time(kafka_consumergroup_lag_max[5m]) > 100000
        for: 5m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Very high Kafka consumer group lag"
          description: "Consumer group {{ $labels.group }} on topic {{ $labels.topic }} has a max lag of {{ $value }} messages."
          impact: "High - Significant data processing backlog"
          action: "Immediate action: scale consumers or pause producers"

      # Critical: Consumer Lag SLO Violation
      - alert: KafkaConsumerLagSLO
        expr: max_over_time(kafka_consumergroup_lag_max[5m]) > 250000
        for: 15m
        labels:
          severity: critical
          component: kafka
          slo: "true"
        annotations:
          summary: "Kafka consumer lag has breached the SLO"
          description: "Consumer group {{ $labels.group }} on topic {{ $labels.topic }} has a max lag of {{ $value }} messages for over 15 minutes, violating the SLO."
          impact: "Critical - Service Level Objective for data processing timeliness is not being met."
          action: "Immediately investigate consumer performance, consider scaling up consumers or pausing producers if necessary."

  # ============================================
  # Scrapy Application Alerts
  # ============================================
  - name: scrapy_application
    interval: 30s
    rules:
      # Critical: Scrapy app is down
      - alert: ScrapyAppDown
        expr: up{job="scrapy_app"} == 0
        for: 2m
        labels:
          severity: critical
          component: scrapy
        annotations:
          summary: "Scrapy application is down"
          description: "Scrapy app has been unreachable for more than 2 minutes."
          impact: "Critical - No web scraping is occurring"
          action: "Check Scrapy container: docker-compose logs scrapy-app"

      # Warning: No items being scraped
      - alert: ScrapyNoItemsScraped
        expr: rate(scrapy_items_scraped_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
          component: scrapy
        annotations:
          summary: "Scrapy is not scraping any items"
          description: "Spider {{ $labels.spider }} has not scraped any items in 10 minutes."
          impact: "Medium - Data collection stalled"
          action: "Check spider logs and website availability"

      # Critical: High error rate
      - alert: ScrapyHighErrorRate
        expr: |
          sum(rate(scrapy_responses_total{status_code=~"[45].."}[5m])) by (spider)
          /
          sum(rate(scrapy_responses_total[5m])) by (spider) > 0.2
        for: 5m
        labels:
          severity: critical
          component: scrapy
        annotations:
          summary: "High error rate in Scrapy spider"
          description: "Spider {{ $labels.spider }} has {{ $value | humanizePercentage }} error rate."
          impact: "High - Most requests are failing"
          action: "Check for IP blocks, website changes, or network issues"

      # Warning: Elevated error rate
      - alert: ScrapyElevatedErrorRate
        expr: |
          sum(rate(scrapy_responses_total{status_code=~"[45].."}[5m])) by (spider)
          /
          sum(rate(scrapy_responses_total[5m])) by (spider) > 0.1
        for: 5m
        labels:
          severity: warning
          component: scrapy
        annotations:
          summary: "Elevated error rate in Scrapy spider"
          description: "Spider {{ $labels.spider }} has {{ $value | humanizePercentage }} error rate."
          impact: "Medium - Significant number of failed requests"
          action: "Monitor spider behavior and investigate errors"

      # Warning: High item drop rate
      - alert: ScrapyHighItemDropRate
        expr: |
          rate(scrapy_items_dropped_total[5m])
          /
          (rate(scrapy_items_scraped_total[5m]) + rate(scrapy_items_dropped_total[5m])) > 0.3
        for: 10m
        labels:
          severity: warning
          component: scrapy
        annotations:
          summary: "High item drop rate"
          description: "Spider {{ $labels.spider }} is dropping {{ $value | humanizePercentage }} of items."
          impact: "Medium - Data quality issues"
          action: "Check validation pipeline and data quality"

      # Warning: Slow response times
      - alert: ScrapySlowResponses
        expr: histogram_quantile(0.95, rate(scrapy_response_time_seconds_bucket[5m])) > 10
        for: 10m
        labels:
          severity: warning
          component: scrapy
        annotations:
          summary: "Slow response times detected"
          description: "Spider {{ $labels.spider }} p95 response time is {{ $value }}s."
          impact: "Medium - Scraping performance degraded"
          action: "Check network latency and target website performance"

      # Critical: Too many 403 responses (blocked)
      - alert: ScrapyBlocked
        expr: rate(scrapy_responses_total{status_code="403"}[5m]) > 1
        for: 5m
        labels:
          severity: critical
          component: scrapy
        annotations:
          summary: "Scrapy spider appears to be blocked"
          description: "Spider {{ $labels.spider }} receiving {{ $value }} 403 responses/sec."
          impact: "High - IP address may be blocked"
          action: "Rotate proxies, adjust user-agent, or reduce request rate"

  # ============================================
  # Kafka Pipeline Alerts
  # ============================================
  - name: kafka_pipeline
    interval: 30s
    rules:
      # Critical: Kafka pipeline is down. kafka-delta-ingest serves no HTTP
      # endpoint (it only sends StatsD), so up{job="kafka_ingestor"} was always 0
      # in Compose and absent in Helm (#178). Fire instead when the broker is
      # taking messages but the ingestor has received none for 10 minutes;
      # `or vector(0)` covers an ingestor that never started.
      - alert: KafkaPipelineDown
        expr: |
          sum(rate(kafka_server_brokertopicmetrics_messagesin_total[10m])) > 0
          and on()
          (sum(rate(kafka_delta_ingest_messages_received_total[10m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: critical
          component: ingestor
        annotations:
          summary: "Kafka to Delta Lake pipeline is down"
          description: "Kafka is receiving messages but kafka-delta-ingest has consumed none for 15 minutes."
          impact: "Critical - Data not being persisted to Delta Lake"
          action: "Check ingestor: docker-compose logs kafka-delta-ingestor"

      # Critical: High message failure rate
      # main.rs counts per-message failures as kafka_delta_ingest.errors.<reason>
      # (mapped to kafka_delta_ingest_errors_total{reason}); there is no
      # ingestor_records_failed_total (#178).
      - alert: KafkaHighMessageFailureRate
        expr: |
          sum(rate(kafka_delta_ingest_errors_total{reason=~"parse_failed|schema_validation_failed|missing_required_field"}[5m])) > 10
        for: 5m
        labels:
          severity: critical
          component: ingestor
        annotations:
          summary: "High Kafka message processing failure rate"
          description: "{{ $value }} messages/sec are failing to process."
          impact: "High - Data loss occurring"
          action: "Check ingestor logs for errors and Delta Lake connectivity"

      # Warning: Slow Delta Lake writes
      # main.rs times write+commit as the StatsD timer batch.write; statsd-exporter
      # turns it into the kafka_delta_ingest_batch_write_seconds histogram (#178).
      - alert: SlowDeltaLakeWrites
        expr: histogram_quantile(0.95, sum by (le) (rate(kafka_delta_ingest_batch_write_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: warning
          component: ingestor
        annotations:
          summary: "Slow Delta Lake write performance"
          description: "P95 batch write latency is {{ $value }}s."
          impact: "Medium - Ingestion performance degraded"
          action: "Check Delta Lake storage performance and network"

      # Consecutive Delta write failures in the Rust ingest (#535). main.rs
      # retries each batch with backoff (1s..30s), never commits Kafka offsets
      # for an unwritten batch (#282), and exits after --max-write-attempts so
      # the pod restarts and re-consumes. Failures with no successful batch in
      # the window mean the lake is rejecting writes and ingest is stalled or
      # crash-looping, even if consumer lag looks flat between restarts.
      - alert: KafkaIngestConsecutiveWriteFailures
        expr: |
          sum(increase(kafka_delta_ingest_write_failures_total[10m])) >= 3
            unless sum(increase(kafka_delta_ingest_batches_written_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          component: ingestor
        annotations:
          summary: "kafka-delta-ingest: Delta writes failing with no successful batch for 10m"
          description: "{{ $value }} write attempts failed in the last 10m and no batch committed. Offsets are held (at-least-once), so data is safe in Kafka, but nothing is reaching the lake."
          impact: "High - Ingest stalled; the process exits after max write attempts and restarts"
          action: "Check ingestor logs for 'Failed to write batch', Delta storage credentials/permissions/capacity, and table schema drift"

      - alert: KafkaIngestWriteFailuresSustained
        expr: |
          sum(increase(kafka_delta_ingest_write_failures_total[30m])) >= 10
            unless sum(increase(kafka_delta_ingest_batches_written_total[30m])) > 0
        for: 10m
        labels:
          severity: critical
          component: ingestor
        annotations:
          summary: "kafka-delta-ingest: no successful Delta write for 30m+"
          description: "{{ $value }} failed write attempts in 30m and zero committed batches. Kafka retention is now the only buffer."
          impact: "Critical - Data loss once Kafka retention expires"
          action: "Page the on-call: fix Delta storage, or pause producers before retention runs out"

  # ============================================
  # Lakehouse (Python writer) durability (#225, #167)
  # ============================================
  - name: delta_lakehouse_writes
    interval: 30s
    rules:
      # Sustained async write failures: batches are being spilled, not written.
      - alert: DeltaWriteFailuresSustained
        expr: sum by (table) (increase(delta_write_failures_total{outcome="spilled"}[15m])) > 0
        for: 15m
        labels:
          severity: critical
          component: delta
        annotations:
          summary: "Delta writes for {{ $labels.table }} keep failing and spilling to disk"
          description: "{{ $value }} batches for {{ $labels.table }} exhausted retries in 15m and were spilled to _write_spill/."
          impact: "High - Data is durable on local disk but missing from the lake until replayed"
          action: "Fix the Delta/storage error, then run LakehouseManager.replay_spilled_writes()"

      # A batch could not be written AND could not be spilled (e.g. ENOSPC on the
      # lake volume, which also holds _write_spill/). Those rows are gone (#661).
      - alert: DeltaWriteDataLoss
        expr: sum by (table) (increase(delta_write_failures_total{outcome="lost"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          component: delta
        annotations:
          summary: "Delta write batches for {{ $labels.table }} were LOST (write and spill both failed)"
          description: "{{ $value }} batches for {{ $labels.table }} could neither be written nor spilled in 5m; see DATA LOSS in the writer logs."
          impact: "Critical - Rows are permanently missing from the lake"
          action: "Page the on-call: free space / fix permissions on the lake volume (df -h, df -i), then re-run the affected stage for the window"

      # Producers hitting a full async queue (backpressure) instead of hanging.
      - alert: DeltaWriteQueueSaturated
        expr: sum(increase(delta_write_queue_full_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          component: delta
        annotations:
          summary: "Delta async write queue is saturated"
          description: "Writers found the queue full for queue_put_timeout_seconds and spilled {{ $value }} batches in 10m (depth: delta_write_queue_depth)."
          impact: "Medium - Writer thread cannot keep up; batches spilled to disk"
          action: "Check writer thread health and storage latency; raise delta_lake.queue_maxsize only if storage is healthy"

      # Sustained async-queue backlog (#166): batches only in process memory are
      # lost on SIGKILL/OOM, so a queue that never drains is a data-loss window.
      - alert: DeltaWriteQueueBacklog
        expr: max(delta_write_queue_depth) > 100
        for: 10m
        labels:
          severity: warning
          component: delta
        annotations:
          summary: "Delta async write queue has had a backlog for 10m"
          description: "{{ $value }} batches have been waiting in the in-memory write queue. They are durable only after the writer commits them (SIGTERM drains or spills them; SIGKILL/OOM loses them)."
          impact: "Medium - Batches still in memory are lost on a hard crash"
          action: "Check Delta storage latency and writer thread health; consider async_write=False for critical tables"

  # ============================================
  # Infrastructure Alerts
  # ============================================
  - name: infrastructure
    interval: 30s
    rules:
      # Critical: Redis is down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for more than 1 minute."
          impact: "Critical - Queue system and circuit breakers offline"
          action: "Restart Redis: docker-compose restart redis"

      # Warning: High Redis memory usage
      # #161: maxmemory-policy is volatile-lru, so TTL-less seen sets and queues
      # are never evicted; at maxmemory Redis rejects writes instead. Warn at 80%
      # so there is time to act before enqueues and seen-marks start failing.
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.8
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of maxmemory."
          impact: "Medium - At 100% Redis rejects writes (enqueue, seen-marks); durable keys are never evicted"
          action: "Raise maxmemory or drain queues; never switch to an allkeys-* policy"

      # Soft-ban / captcha responses (#582): pages are quarantined, never
      # analysed; a sustained rate means a site is blocking the crawler.
      - alert: ScrapySoftBanSpike
        expr: sum by (stage, signature) (rate(scrapy_soft_ban_total[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
          component: crawler
        annotations:
          summary: "Soft bans ({{ $labels.signature }}) in {{ $labels.stage }}"
          description: "{{ $value }}/s responses classified as soft-ban/captcha. They are quarantined (stage2_errors / dropped in Stage 1) and the domain is backed off, but crawl budget is being burned."
          impact: "Medium - Affected domains are not being crawled; no poisoned content written"
          action: "Check scrapy_soft_ban_domain_backoff_total and stage2_errors rows with error_message LIKE 'soft_ban:%'; lower concurrency or raise SOFT_BAN_BACKOFF_COOLDOWN for the domain"

      # Redis pool saturated (#533). The seen/claim paths fail closed on
      # exhaustion (admission pauses, no duplicate crawl), so this means
      # throughput is being throttled by REDIS_MAX_CONNECTIONS or a slow Redis.
      - alert: RedisPoolExhausted
        expr: sum by (op) (rate(redis_pool_exhausted_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis connection pool exhausted during {{ $labels.op }}"
          description: "Workers are waiting longer than REDIS_POOL_TIMEOUT for a pooled Redis connection ({{ $value }}/s). Seen/claim operations are failing closed, so URL admission is paused rather than duplicated."
          impact: "Medium - Crawl admission throttled; no duplicate crawling"
          action: "Check Redis latency (slowlog) and maxclients; resize REDIS_MAX_CONNECTIONS per the README 'Redis connection pool sizing' model"

      # Seen-URL store failing closed for any reason (#163, #533).
      - alert: RedisSeenStoreFailingClosed
        expr: sum by (op) (rate(redis_seen_check_errors_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis seen-URL store errors ({{ $labels.op }}) for 10m"
          description: "{{ $value }}/s seen-store operations are failing. Admission pauses instead of re-crawling, so the crawl is stalling."
          impact: "High - Discovery stalled while the seen store is unavailable"
          action: "Check RedisDown and RedisPoolExhausted; do not set REDIS_SEEN_FAIL_MODE=open in production"

      # Critical: PostgreSQL is down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been unreachable for more than 1 minute."
          impact: "High - Metrics storage offline"
          action: "Restart PostgreSQL: docker-compose restart postgres"

      # Postgres metrics sink failing (#586). Stage metrics are dual-exported, so
      # Prometheus still has them, but Postgres history has gaps and the dropped
      # records only exist as metrics_sink_fallback WARNING log lines.
      - alert: PostgresMetricsSinkFailing
        expr: |
          sum(rate(scrapy_pg_metrics_writes_total{outcome="failure"}[5m]))
            / clamp_min(sum(rate(scrapy_pg_metrics_writes_total{outcome=~"success|failure"}[5m])), 1e-9)
            > 0.1
        for: 5m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: "Postgres metrics sink is failing ({{ $value | humanizePercentage }} of writes)"
          description: "More than 10% of performance/error records failed to reach Postgres for 5 minutes. The crawl continues; Prometheus still has the stage series (scrapy_stage_*), and each dropped record is logged as 'metrics_sink_fallback' at WARNING."
          impact: "Medium - Postgres metric/error history has gaps; Prometheus alerting is unaffected"
          action: "Check PostgresDown / connection pool; backfill from metrics_sink_fallback log lines if the history matters"

      # Warning: High PostgreSQL connection usage
      - alert: PostgresHighConnections
        expr: |
          pg_stat_database_numbackends
          /
          pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: "PostgreSQL connection usage high"
          description: "PostgreSQL is using {{ $value | humanizePercentage }} of max connections."
          impact: "Medium - Risk of connection exhaustion"
          action: "Review connection pooling and close idle connections"

  # ============================================
  # Prometheus & Monitoring Alerts
  # ============================================
  - name: monitoring
    interval: 1m
    rules:
      # Warning: Prometheus is approaching storage capacity
      - alert: PrometheusStorageNearFull
        expr: |
          (1 - (prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes)) < 0.1
        for: 30m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus storage nearly full"
          description: "Prometheus has less than 10% storage available."
          impact: "Medium - Risk of data loss"
          action: "Increase retention limit or reduce scrape frequency"

      # Critical: Prometheus scrape failures
      - alert: PrometheusScrapeFailures
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus cannot scrape target"
          description: "Target {{ $labels.job }} ({{ $labels.instance }}) is unreachable."
          impact: "Medium - Missing metrics for this target"
          action: "Check target health and network connectivity"

  # ============================================
  # Business Logic / Data Quality Alerts
  # ============================================
  - name: data_quality
    interval: 1m
    rules:
      # Warning: Scraping throughput significantly decreased
      - alert: ScrapingThroughputDropped
        expr: |
          (
            sum(rate(scrapy_items_scraped_total[5m]))
            /
            sum(rate(scrapy_items_scraped_total[5m] offset 1h))
          ) < 0.5
        for: 15m
        labels:
          severity: warning
          component: pipeline
        annotations:
          summary: "Scraping throughput has dropped significantly"
          description: "Current throughput is {{ $value | humanizePercentage }} of 1 hour ago."
          impact: "Medium - Reduced data collection rate"
          action: "Investigate spider performance and target site availability"

      # Info: Circuit breakers open
      - alert: CircuitBreakersOpen
        expr: circuit_breaker_open_count > 0
        for: 10m
        labels:
          severity: info
          component: pipeline
        annotations:
          summary: "Circuit breakers are open"
          description: "{{ $value }} circuit breakers are currently open."
          impact: "Low - Some domains are temporarily blocked"
          action: "Normal operation - circuits will auto-recover"

      # Warning: Low Delta Lake write rate. Each batches.written is one Delta
      # commit (write_batch commits once per batch); there is no
      # ingestor_delta_commits_total (#178).
      - alert: LowDeltaLakeWrites
        expr: sum(rate(kafka_delta_ingest_batches_written_total[15m])) == 0
        for: 15m
        labels:
          severity: warning
          component: ingestor
        annotations:
          summary: "No Delta Lake commits in 15 minutes"
          description: "No data is being written to Delta Lake."
          impact: "Medium - Data persistence stalled"
          action: "Check Kafka consumer and Delta Lake connectivity"

      # Moved from the old monitoring/alerts.yml, which Prometheus never loaded
      # (rule_files lists only recording_rules.yml and alerting_rules.yml) and
      # which used names nothing emitted (#178). metrics_exporter.py sends
      # errors.total{stage,error_type}; statsd_mapping.yml names it
      # pipeline_errors_total.
      - alert: PipelineHighErrorRate
        expr: sum by (stage) (rate(pipeline_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: pipeline
        annotations:
          summary: "High pipeline error rate in {{ $labels.stage }}"
          description: "{{ $value }} errors/sec recorded for {{ $labels.stage }} over 5 minutes."
          impact: "Medium - URLs in this stage are failing"
          action: "Check the stage worker logs and the error_type label of pipeline_errors_total"

      # metrics_exporter.py sends redis.queue.length{queue}; statsd_mapping.yml
      # names it redis_queue_length.
      - alert: QueueBacklog
        expr: max by (queue) (redis_queue_length) > 10000
        for: 10m
        labels:
          severity: warning
          component: pipeline
        annotations:
          summary: "Large backlog in {{ $labels.queue }}"
          description: "{{ $labels.queue }} has {{ $value }} items pending for 10 minutes."
          impact: "Medium - Crawl latency grows while workers fall behind"
          action: "Scale the consuming stage or check it for stalls"
