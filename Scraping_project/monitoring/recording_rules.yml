# ==================================================================
# Prometheus Recording Rules for Scrapy Pipeline
# ==================================================================
# Recording rules pre-compute frequently needed or expensive queries
# to improve dashboard performance and reduce query load on Prometheus
# ==================================================================

groups:
  # ============================================
  # Scrapy Application Metrics
  # ============================================
  - name: scrapy_performance
    interval: 30s
    rules:
      # Items scraped rate per spider (5-minute window)
      - record: scrapy:items_scraped:rate5m
        expr: rate(scrapy_items_scraped_total[5m])

      # Items scraped rate per spider (1-minute window)
      - record: scrapy:items_scraped:rate1m
        expr: rate(scrapy_items_scraped_total[1m])

      # Total items scraped across all spiders
      - record: scrapy:items_scraped:total
        expr: sum(scrapy_items_scraped_total)

      # Items dropped rate per spider
      - record: scrapy:items_dropped:rate5m
        expr: rate(scrapy_items_dropped_total[5m])

      # Drop rate percentage (dropped / scraped)
      - record: scrapy:items_drop_rate:ratio
        expr: |
          rate(scrapy_items_dropped_total[5m])
          /
          (rate(scrapy_items_scraped_total[5m]) + rate(scrapy_items_dropped_total[5m]))

      # Request rate per spider
      - record: scrapy:requests:rate5m
        expr: rate(scrapy_requests_total[5m])

      # Response rate by status code
      - record: scrapy:responses:rate5m
        expr: rate(scrapy_responses_total[5m])

      # Success response rate (2xx status codes)
      - record: scrapy:responses_success:rate5m
        expr: rate(scrapy_responses_total{status_code=~"2.."}[5m])

      # Error response rate (4xx and 5xx status codes)
      - record: scrapy:responses_error:rate5m
        expr: rate(scrapy_responses_total{status_code=~"[45].."}[5m])

      # Error rate percentage
      - record: scrapy:error_rate:ratio
        expr: |
          sum(rate(scrapy_responses_total{status_code=~"[45].."}[5m])) by (spider)
          /
          sum(rate(scrapy_responses_total[5m])) by (spider)

      # Average response time (p50, p95, p99)
      - record: scrapy:response_time:p50
        expr: histogram_quantile(0.50, rate(scrapy_response_time_seconds_bucket[5m]))

      - record: scrapy:response_time:p95
        expr: histogram_quantile(0.95, rate(scrapy_response_time_seconds_bucket[5m]))

      - record: scrapy:response_time:p99
        expr: histogram_quantile(0.99, rate(scrapy_response_time_seconds_bucket[5m]))

      # Bandwidth usage (bytes per second)
      - record: scrapy:bandwidth_sent:rate5m
        expr: rate(scrapy_downloader_request_bytes_total[5m])

      - record: scrapy:bandwidth_received:rate5m
        expr: rate(scrapy_downloader_response_bytes_total[5m])

  # ============================================
  # Kafka Metrics
  # ============================================
  - name: kafka_performance
    interval: 30s
    rules:
      # Messages consumed rate
      - record: kafka:messages_consumed:rate5m
        expr: rate(kafka_messages_consumed_total[5m])

      # Messages processed rate
      - record: kafka:messages_processed:rate5m
        expr: rate(kafka_messages_processed_total[5m])

      # Messages failed rate
      - record: kafka:messages_failed:rate5m
        expr: rate(kafka_messages_failed_total[5m])

      # Processing success rate percentage
      - record: kafka:processing_success_rate:ratio
        expr: |
          rate(kafka_messages_processed_total[5m])
          /
          rate(kafka_messages_consumed_total[5m])

      # Consumer lag (current lag)
      - record: kafka:consumer_lag:current
        expr: kafka_consumer_lag

      # Delta Lake batch write latency (p95)
      - record: delta:batch_write:p95
        expr: histogram_quantile(0.95, rate(delta_batch_write_seconds_bucket[5m]))

      # Average batch size
      - record: delta:batch_size:avg
        expr: rate(delta_batch_size_sum[5m]) / rate(delta_batch_size_count[5m])

      # --- Consumer Group Lag Aggregation ---
      # The 'group' label is extracted from 'client_id' assuming the convention '{group}-{identifier}'.
      # This is necessary because the JMX metric only provides per-partition lag via client_id.

      # Max lag per consumer group (worst partition) - FOR SLO ALERTS
      - record: kafka_consumergroup_lag_max
        expr: |
          max by (topic, group) (
            label_replace(
              kafka_consumer_records_lag,
              "group", "$1", "client_id", "([^-]+).*"
            )
          )

      # Sum of lags per consumer group (total debt) - FOR DASHBOARDS
      - record: kafka_consumergroup_lag_sum
        expr: |
          sum by (topic, group) (
            label_replace(
              kafka_consumer_records_lag,
              "group", "$1", "client_id", "([^-]+).*"
            )
          )

  # ============================================
  # System Resource Metrics
  # ============================================
  - name: system_resources
    interval: 30s
    rules:
      # Redis memory usage percentage
      - record: redis:memory_usage:ratio
        expr: |
          redis_memory_used_bytes
          /
          redis_memory_max_bytes

      # PostgreSQL connection usage percentage
      - record: postgres:connections_usage:ratio
        expr: |
          pg_stat_database_numbackends
          /
          pg_settings_max_connections

      # PostgreSQL query rate
      - record: postgres:queries:rate5m
        expr: rate(pg_stat_database_xact_commit[5m])

  # ============================================
  # Aggregated Pipeline Metrics
  # ============================================
  - name: pipeline_aggregates
    interval: 60s
    rules:
      # Total throughput (items per second across all spiders)
      - record: pipeline:throughput:total
        expr: sum(rate(scrapy_items_scraped_total[5m]))

      # Total error rate across all components
      - record: pipeline:errors:rate5m
        expr: |
          sum(rate(scrapy_items_dropped_total[5m])) +
          sum(rate(kafka_messages_failed_total[5m]))

      # End-to-end latency (scrape to Delta Lake write)
      # This is an approximation based on available metrics
      - record: pipeline:latency:p95
        expr: |
          histogram_quantile(0.95, rate(scrapy_response_time_seconds_bucket[5m])) +
          histogram_quantile(0.95, rate(delta_batch_write_seconds_bucket[5m]))

      # Pipeline health score (0-1, where 1 is healthy)
      # Based on success rates and active components
      - record: pipeline:health:score
        expr: |
          (
            sum(rate(scrapy_items_scraped_total[5m])) /
            (sum(rate(scrapy_items_scraped_total[5m])) + sum(rate(scrapy_items_dropped_total[5m])) + 0.01)
          ) * 0.5 +
          (
            sum(rate(kafka_messages_processed_total[5m])) /
            (sum(rate(kafka_messages_consumed_total[5m])) + 0.01)
          ) * 0.5
