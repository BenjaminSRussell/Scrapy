apiVersion: 1

datasources:
  # Primary Prometheus (Replica A)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-a:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 60s

  # Prometheus Replica B (Backup/HA)
  - name: Prometheus-B
    type: prometheus
    access: proxy
    url: http://prometheus-b:9090
    editable: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 60s

  # Redis (via Redis datasource plugin)
  - name: Redis
    type: redis-datasource
    access: proxy
    url: redis://redis:6379
    editable: true
    jsonData:
      client: standalone
      poolSize: 5
      timeout: 10
      pingInterval: 0

  # PostgreSQL (for metrics/analytics)
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: pipeline_metrics
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
    editable: true
