apiVersion: 1

datasources:
  # Prometheus (the `prometheus` service in docker-compose.yml). A fixed uid
  # lets provisioned dashboards default to it (#157).
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 60s

  # Redis (via Redis datasource plugin)
  - name: Redis
    type: redis-datasource
    access: proxy
    url: redis://redis:6379
    editable: true
    jsonData:
      client: standalone
      poolSize: 5
      timeout: 10
      pingInterval: 0

  # PostgreSQL (for metrics/analytics)
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: scraping_pipeline  # POSTGRES_DB in docker-compose.yml
    user: postgres
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
    editable: true
