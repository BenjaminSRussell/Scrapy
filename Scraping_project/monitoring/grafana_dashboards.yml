apiVersion: 1

providers:
  - name: 'UConn Scraping Pipeline - Unified Dashboard'
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 5
    allowUiUpdates: true
    options:
      # docker-compose.yml and the Helm chart both mount monitoring/dashboards/ here (#157).
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
