apiVersion: 1

providers:
  # Main pipeline dashboard
  - name: 'Pipeline Dashboards'
    orgId: 1
    folder: 'Scraping Pipeline'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
