global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'scraping-pipeline'
    # This will be overridden by environment variable for each replica
    replica: '${PROMETHEUS_REPLICA:-a}'

# Alertmanager cluster configuration
alerting:
  alertmanagers:
    - static_configs:
        # Send to all 3 Alertmanager replicas
        # The cluster handles deduplication internally
        - targets:
            - 'alertmanager-1:9093'
            - 'alertmanager-2:9093'
            - 'alertmanager-3:9093'

# Load recording and alerting rules
rule_files:
  - '/etc/prometheus/recording_rules.yml'
  # - '/etc/prometheus/alerting_rules.yml'  # Uncomment when ready

scrape_configs:
  # Scrape Scrapy application metrics
  - job_name: 'scrapy_app'
    static_configs:
      - targets: ['scrapy-app:9410']
        labels:
          service: 'scrapy'
          component: 'scraper'

  # Scrape Kafka to Delta Lake ingestor metrics
  - job_name: 'kafka_ingestor'
    static_configs:
      - targets: ['ingestor:8001']
        labels:
          service: 'ingestor'
          component: 'kafka-delta'

  # Scrape pipeline metrics
  - job_name: 'scraping_pipeline'
    static_configs:
      - targets: ['metrics-exporter:8000']
        labels:
          service: 'pipeline'

  # Scrape Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Scrape PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Scrape Kafka JMX metrics
  - job_name: 'kafka_jmx'
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']
        labels:
          service: 'kafka'
          component: 'broker'

  # Scrape StatsD metrics (kafka-delta-ingest)
  - job_name: 'statsd'
    static_configs:
      - targets: ['statsd-exporter:9102']
        labels:
          service: 'ingestor'
          component: 'metrics'
