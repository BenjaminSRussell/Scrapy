global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'scraping-pipeline'
    # This will be overridden by environment variable for each replica
    replica: '${PROMETHEUS_REPLICA:-a}'

# Alertmanager cluster configuration
alerting:
  alertmanagers:
    - static_configs:
        # Send to all 3 Alertmanager replicas
        # The cluster handles deduplication internally
        - targets:
            - 'alertmanager-1:9093'
            - 'alertmanager-2:9093'
            - 'alertmanager-3:9093'

# Load recording and alerting rules
rule_files:
  - '/etc/prometheus/recording_rules.yml'
  - '/etc/prometheus/alerting_rules.yml'

scrape_configs:
  # Scrape Scrapy application metrics - Multiple instances for extreme throughput
  - job_name: 'scrapy_app'
    scrape_interval: 10s  # Frequent scraping for real-time monitoring
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'scrapy-app:9410'
          - 'scrapy-app:9411'
          - 'scrapy-app:9412'
          - 'scrapy-app:9413'
          - 'scrapy-app:9414'
          - 'scrapy-app:9415'
          - 'scrapy-app:9416'
          - 'scrapy-app:9417'
          - 'scrapy-app:9418'
          - 'scrapy-app:9419'
          - 'scrapy-app:9420'
        labels:
          service: 'scrapy'
          component: 'scraper'
          environment: 'development'

  # Scrape Kafka to Delta Lake ingestor metrics
  - job_name: 'kafka_ingestor'
    static_configs:
      - targets: ['ingestor:8001']
        labels:
          service: 'ingestor'
          component: 'kafka-delta'

  # Scrape pipeline metrics - Delta Lake, queues, circuit breakers
  - job_name: 'scraping_pipeline'
    scrape_interval: 5s  # Match metrics exporter update interval
    scrape_timeout: 3s
    static_configs:
      - targets: ['metrics-exporter:9090']
        labels:
          service: 'pipeline'
          component: 'metrics'

  # Scrape Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Scrape PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Scrape Kafka JMX metrics - Real-time metrics from Kafka broker
  - job_name: 'kafka_jmx'
    scrape_interval: 10s  # More frequent scraping for real-time data
    scrape_timeout: 5s
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']
        labels:
          service: 'kafka'
          component: 'broker'
          environment: 'development'

  # Scrape StatsD metrics (kafka-delta-ingest) - Real-time ingest metrics
  - job_name: 'statsd'
    scrape_interval: 10s  # Frequent scraping for real-time ingest monitoring
    scrape_timeout: 5s
    static_configs:
      - targets: ['statsd-exporter:9102']
        labels:
          service: 'ingestor'
          component: 'metrics'
          environment: 'development'
