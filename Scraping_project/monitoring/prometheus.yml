global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'scraping-pipeline'
    # This will be overridden by environment variable for each replica
    replica: '${PROMETHEUS_REPLICA:-a}'

# Alertmanager cluster configuration
alerting:
  alertmanagers:
    - static_configs:
        # Send to all 3 Alertmanager replicas
        # The cluster handles deduplication internally
        - targets:
            - 'alertmanager-1:9093'
            - 'alertmanager-2:9093'
            - 'alertmanager-3:9093'

# Load recording and alerting rules
rule_files:
  - '/etc/prometheus/recording_rules.yml'
  - '/etc/prometheus/alerting_rules.yml'

scrape_configs:
  # Scrape Scrapy application metrics - Multiple instances for extreme throughput
  - job_name: 'scrapy_app'
    scrape_interval: 30s  # OPTIMIZED: Reduced from 10s (66% less load, still plenty for monitoring)
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'scrapy-app:9410'
          - 'scrapy-app:9411'
          - 'scrapy-app:9412'
          - 'scrapy-app:9413'
          - 'scrapy-app:9414'
          - 'scrapy-app:9415'
          - 'scrapy-app:9416'
          - 'scrapy-app:9417'
          - 'scrapy-app:9418'
          - 'scrapy-app:9419'
          - 'scrapy-app:9420'
        labels:
          service: 'scrapy'
          component: 'scraper'
          environment: 'development'

  # kafka-delta-ingest has no HTTP endpoint (nothing listens on :8001); it
  # sends StatsD, so its metrics arrive through the 'statsd' job below. The old
  # 'kafka_ingestor' job was always down, which kept PrometheusScrapeFailures
  # and KafkaPipelineDown firing (#178).

  # Scrape pipeline metrics - Delta Lake, queues, circuit breakers
  - job_name: 'scraping_pipeline'
    scrape_interval: 30s  # OPTIMIZED: Reduced from 5s (83% less load!)
    scrape_timeout: 10s
    static_configs:
      - targets: ['metrics-exporter:9090']
        labels:
          service: 'pipeline'
          component: 'metrics'

  # Scrape Redis metrics
  - job_name: 'redis'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Scrape PostgreSQL metrics
  - job_name: 'postgres'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Scrape Kafka JMX metrics - Real-time metrics from Kafka broker
  - job_name: 'kafka_jmx'
    scrape_interval: 30s  # OPTIMIZED: Reduced from 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']
        labels:
          service: 'kafka'
          component: 'broker'
          environment: 'development'

  # #789: Stage 2 worker /metrics (src/utils/worker_metrics.py). dns_sd
  # resolves every replica of the compose service, so each is scraped.
  - job_name: 'stage2_worker'
    scrape_interval: 30s
    scrape_timeout: 10s
    dns_sd_configs:
      - names: ['stage2-worker']
        type: A
        port: 9430
    relabel_configs:
      - target_label: service
        replacement: 'stage2'
      - target_label: component
        replacement: 'worker'
      - target_label: environment
        replacement: 'development'

  # #789: Stage 3 worker /metrics (src/utils/worker_metrics.py). dns_sd
  # resolves every replica of the compose service, so each is scraped.
  - job_name: 'stage3_worker'
    scrape_interval: 30s
    scrape_timeout: 10s
    dns_sd_configs:
      - names: ['stage3-worker']
        type: A
        port: 9430
    relabel_configs:
      - target_label: service
        replacement: 'stage3'
      - target_label: component
        replacement: 'worker'
      - target_label: environment
        replacement: 'development'

  # #789: Stage 4 worker /metrics (src/utils/worker_metrics.py). dns_sd
  # resolves every replica of the compose service, so each is scraped.
  - job_name: 'stage4_worker'
    scrape_interval: 30s
    scrape_timeout: 10s
    dns_sd_configs:
      - names: ['stage4-worker']
        type: A
        port: 9430
    relabel_configs:
      - target_label: service
        replacement: 'stage4'
      - target_label: component
        replacement: 'worker'
      - target_label: environment
        replacement: 'development'

  # Scrape StatsD metrics (kafka-delta-ingest) - Real-time ingest metrics
  - job_name: 'statsd'
    scrape_interval: 30s  # OPTIMIZED: Reduced from 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ['statsd-exporter:9102']
        labels:
          service: 'ingestor'
          component: 'metrics'
          environment: 'development'
