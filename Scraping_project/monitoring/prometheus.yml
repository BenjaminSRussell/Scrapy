# Prometheus config for the local docker compose stack (docker-compose.yml).
#
# Scrape only what compose actually runs (#371). Before, this file was a copy
# of the full-stack config: it scraped scrapy-app, metrics-exporter, Kafka
# JMX, statsd-exporter and three Alertmanagers, none of which exist in compose,
# so every one of those targets was permanently down.
#
# The full stack (Kafka, kafka-delta-ingest, statsd-exporter, metrics-exporter,
# Alertmanager cluster) runs under Helm, which renders its own config:
#   k8s/helm/scraping-pipeline/templates/prometheus-statefulset.yaml
# Rules are shared, so alerts on Helm-only jobs (e.g. up{job="kafka_jmx"})
# simply have no series here and stay inactive.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'scraping-pipeline'
    # Prometheus does not expand ${VARS} in its config; the old
    # '${PROMETHEUS_REPLICA:-a}' value was shipped as that literal string.
    replica: 'compose'

# No Alertmanager runs in compose; alerts are visible at :9090/alerts and in
# Grafana alerting (monitoring/alerting). Helm configures its Alertmanagers.

# Mounted by docker-compose.yml next to this file.
rule_files:
  - '/etc/prometheus/recording_rules.yml'
  - '/etc/prometheus/alerting_rules.yml'

scrape_configs:
  # Prometheus' own metrics (TSDB size/retention rules read these).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrapy metrics extension (src/scrapy_prometheus.py, PROMETHEUS_PORT 9410)
  # in the compose `scraper` service.
  - job_name: 'scrapy_app'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['scraper:9410']
        labels:
          service: 'scrapy'
          component: 'scraper'
          environment: 'development'

  # Redis does not speak the Prometheus protocol (scraping redis:6379 was
  # always down); compose runs oliver006/redis_exporter for it.
  - job_name: 'redis'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Same for Postgres: prometheuscommunity/postgres-exporter.
  - job_name: 'postgres'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # #789: Stage 2 worker /metrics (src/utils/worker_metrics.py). dns_sd
  # resolves every replica of the compose service, so each is scraped.
  - job_name: 'stage2_worker'
    scrape_interval: 30s
    scrape_timeout: 10s
    dns_sd_configs:
      - names: ['stage2-worker']
        type: A
        port: 9430
    relabel_configs:
      - target_label: service
        replacement: 'stage2'
      - target_label: component
        replacement: 'worker'
      - target_label: environment
        replacement: 'development'

  # #789: Stage 3 worker /metrics (src/utils/worker_metrics.py). dns_sd
  # resolves every replica of the compose service, so each is scraped.
  - job_name: 'stage3_worker'
    scrape_interval: 30s
    scrape_timeout: 10s
    dns_sd_configs:
      - names: ['stage3-worker']
        type: A
        port: 9430
    relabel_configs:
      - target_label: service
        replacement: 'stage3'
      - target_label: component
        replacement: 'worker'
      - target_label: environment
        replacement: 'development'

  # #789: Stage 4 worker /metrics (src/utils/worker_metrics.py). dns_sd
  # resolves every replica of the compose service, so each is scraped.
  - job_name: 'stage4_worker'
    scrape_interval: 30s
    scrape_timeout: 10s
    dns_sd_configs:
      - names: ['stage4-worker']
        type: A
        port: 9430
    relabel_configs:
      - target_label: service
        replacement: 'stage4'
      - target_label: component
        replacement: 'worker'
      - target_label: environment
        replacement: 'development'

  # Scrape StatsD metrics (kafka-delta-ingest) - Real-time ingest metrics
  - job_name: 'statsd'
    scrape_interval: 30s  # OPTIMIZED: Reduced from 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ['statsd-exporter:9102']
        labels:
          service: 'ingestor'
          component: 'metrics'
          environment: 'development'
