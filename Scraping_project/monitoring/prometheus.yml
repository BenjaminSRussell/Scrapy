global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape pipeline metrics
  - job_name: 'scraping_pipeline'
    static_configs:
      - targets: ['metrics-exporter:8000']
        labels:
          service: 'pipeline'

  # Scrape Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Scrape PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
