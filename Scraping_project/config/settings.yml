# Ultra Scraping Pipeline Configuration

# Discovery settings
discovery:
  max_depth: 999  # Unlimited - find ALL URLs
  concurrent_requests: 32
  download_delay: 0.1
  update_seed_file: true  # Auto-add new URLs to seed file

# Enrichment settings
enrichment:
  nlp_enabled: true
  process_media: true  # OCR + Whisper
  max_images_per_page: 10
  max_audio_per_page: 5
  max_video_per_page: 3

# Delta Lake settings
delta_lake:
  location: "data/delta_lake"
  auto_checkpoint: true
  retention_hours: 168  # 7 days

# Media processing
media:
  ocr_engine: "easyocr"
  whisper_model: "base"
  timeout: 60  # seconds

# NLP
nlp:
  use_yake: true
  use_deberta: true
  deberta_model: "microsoft/deberta-v3-base"
