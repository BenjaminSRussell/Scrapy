[pytest]
# Pytest Configuration for Scraping Pipeline
# ==========================================

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
pythonpath = . src

# Output and reporting options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Coverage options
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-branch
    # Strict markers - fail on unknown markers
    --strict-markers
    # Show warnings
    -W default
    # Parallel execution (adjust -n value based on CPU cores)
    -n auto
    # Show slowest 10 tests
    --durations=10
    # Short traceback format
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require external services)
    slow: Slow tests (> 1 second)
    redis: Tests requiring Redis
    postgres: Tests requiring PostgreSQL
    kafka: Tests requiring Kafka
    scrapy: Tests for Scrapy spiders
    stage1: Stage 1 spider tests
    stage2: Stage 2 worker tests
    stage3: Stage 3 worker tests
    stage4: Stage 4 processor tests
    smoke: Smoke tests (quick sanity checks)
    security: Security-related tests
    performance: Performance benchmarking tests
    critical: Critical regression tests
    component: Component tests
    contract: Contract tests
    observability: Tests for metrics and monitoring
    asyncio: mark a test as asyncio-driven.

# Asyncio configuration
asyncio_mode = auto

# Environment variables for tests
env =
    OBS_OFFLINE=1

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeouts (requires pytest-timeout)
timeout = 300
timeout_method = thread

[coverage:report]
fail_under = 70
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    @abstractmethod
    if TYPE_CHECKING:
    \.\.\.

[coverage:run]
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */.venv/*
    */site-packages/*
    */dist/*
    */build/*
