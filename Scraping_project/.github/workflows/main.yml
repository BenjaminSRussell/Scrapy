name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and start services
        run: docker-compose up -d --build

      - name: Run linting
        run: docker-compose exec scrapy-app ruff check .

      - name: Run tests
        run: docker-compose exec scrapy-app pytest
