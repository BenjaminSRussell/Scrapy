# Docker Compose configuration for UConn Scraping Pipeline
# Profiles (#145): core | monitoring | streaming, plus ml | full for Stage 4 (#144).
# Observability (Loki / Jaeger / OTEL) is the overlay docker-compose.observability.yml.
# One command for the lean stack + monitoring (no torch, no Kafka):
#   docker compose --profile core --profile monitoring up -d
# See COMPOSE.md. Redis contract is REDIS_HOST / REDIS_PORT / REDIS_PASSWORD / REDIS_DB.

services:
  # Main scraping application
  scraper:
    profiles: ["core"]
    build:
      context: .
      target: production
    container_name: uconn-scraper
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DELTA_LAKE_PATH=/data/delta
      - LOG_LEVEL=INFO
      - WORKERS=4
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Redis for caching and queue management
  redis:
    profiles: ["core", "monitoring", "ml", "full"]
    image: redis:7-alpine
    container_name: uconn-redis
    restart: unless-stopped
    # #184: set REDIS_PASSWORD (e.g. in .env) to require AUTH. Leaving it unset
    # keeps an open Redis for local dev ONLY - the app logs a warning. The port
    # is bound to localhost so the host never exposes Redis to its network.
    # $$ defers expansion to the container shell (not compose interpolation).
    # volatile-lru (#161): only keys with a TTL are evictable. Seen-URL sets and
    # queues have no TTL, so under memory pressure writes fail loudly instead of
    # the seen set being silently evicted (which caused full recrawls).
    command: >-
      sh -c 'exec redis-server --appendonly yes --maxmemory 2gb
      --maxmemory-policy volatile-lru $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scraper-network
    healthcheck:
      # NOAUTH also proves the server is up, so no password is needed here.
      test: ["CMD-SHELL", "redis-cli ping | grep -Eq 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL for pipeline metrics and error logs
  postgres:
    profiles: ["core", "monitoring", "streaming"]
    image: postgres:16-alpine
    container_name: uconn-postgres
    restart: unless-stopped
    environment:
      # Superuser: only init-db.sql (schema/migrations) runs as it (#538).
      - POSTGRES_USER=postgres
      # From .env; "postgres" is a local-dev default only (#482: rotate if leaked).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=scraping_pipeline
      # Least-privilege role the workers connect as (created by init-db.sql).
      - APP_DB_USER=scrapy_app
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-scrapy_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # First start of an empty volume only. Existing volume: see docker/init-db.sql header.
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Stage 1: URL Discovery Worker
  stage1-worker:
    profiles: ["core"]
    build:
      context: .
      target: production
    container_name: stage1-worker
    restart: unless-stopped
    command: python -m src.workers.stage1_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage1
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  # Stage 2: Page Analysis Worker
  stage2-worker:
    profiles: ["core"]
    build:
      context: .
      target: production
    # container_name omitted: incompatible with deploy.replicas (#142)
    restart: unless-stopped
    command: python -m src.workers.stage2_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage2
      - CONCURRENCY=10
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=scraping_pipeline
      - DB_USER=scrapy_app  # least-privilege role, not the superuser (#538)
      - DB_PASSWORD=${APP_DB_PASSWORD:-scrapy_app_dev}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - scraper-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # Stage 3: Summarization Worker (light — datasketch/core, no torch) (#144)
  stage3-worker:
    profiles: ["core"]
    build:
      context: .
      target: stage3
    container_name: stage3-worker
    restart: unless-stopped
    command: python -m src.workers.stage3_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage3
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=scraping_pipeline
      - DB_USER=scrapy_app  # least-privilege role, not the superuser (#538)
      - DB_PASSWORD=${APP_DB_PASSWORD:-scrapy_app_dev}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - scraper-network

  # Stage 4: Large Document Worker (ML + OCR image). Not part of `core` —
  # that profile stays on the lean lock (no torch, #144). Enable with
  # `docker compose --profile ml up -d stage4-worker` (or profile `full`).
  # Redis is also on ml/full so this worker's depends_on still resolves.
  # Redis env stays REDIS_HOST / REDIS_PORT / REDIS_PASSWORD (#511).
  stage4-worker:
    profiles: ["ml", "full"]
    build:
      context: .
      target: stage4
    container_name: stage4-worker
    restart: unless-stopped
    command: python -m src.workers.stage4_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage4
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  # Monitoring dashboard (optional)
  # Exporters scraped by monitoring/prometheus.yml (#371). Redis and Postgres
  # do not serve Prometheus metrics themselves.
  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis
    networks:
      - scraper-network

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/scraping_pipeline?sslmode=disable
    depends_on:
      - postgres
    networks:
      - scraper-network

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      # rule_files in prometheus.yml point here; without these mounts no
      # recording or alerting rule was ever loaded (#371).
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - scraper-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.6.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # From .env (GRAFANA_ADMIN_PASSWORD); the default is for local dev only (#439/#187).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # The Redis datasource in grafana_datasource.yml needs this plugin.
      - GF_PLUGINS_PREINSTALL=redis-datasource
      # Read by the PostgreSQL datasource ($__env{POSTGRES_PASSWORD}).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/alerting:/etc/grafana/provisioning/alerting
      # Datasources + dashboards are provisioned on start (#157): open
      # http://localhost:3000/d/scraping-pipeline-health
      - ./monitoring/grafana_datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana_dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - scraper-network
    depends_on:
      - prometheus


  # Ops dashboard (dashboard/serve.py). Host port is loopback-only.
  # serve.py binds 127.0.0.1 unless told otherwise (#735); the container must
  # listen on all interfaces or the published port never answers.
  dashboard:
    profiles: ["monitoring"]
    build:
      context: .
      target: production
    container_name: pipeline-dashboard
    restart: unless-stopped
    command: python dashboard/serve.py --host 0.0.0.0 --port 8080
    environment:
      - CC_HOST=0.0.0.0
      - CC_PORT=8080
      # Live feed: the same Delta Lake the workers write (read-only here), Redis
      # queue depths, and Prometheus as the metrics-upstream health check.
      - DELTA_LAKE_PATH=/data/delta
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - METRICS_UPSTREAM=http://prometheus:9090/metrics
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./data:/data:ro
    networks:
      - scraper-network

  # Optional Kafka (streaming profile). KRaft combined mode, no ZooKeeper.
  # In-network clients use kafka:9092. Host clients use localhost:9092
  # (config.yml default), published on loopback only.
  kafka:
    profiles: ["streaming"]
    image: apache/kafka:3.9.1
    container_name: uconn-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - scraper-network

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  scraper-network:
    driver: bridge
