# Docker Compose for UConn Scraping Pipeline
# Profiles: core | monitoring | streaming | observability
# Example (core + monitoring):
#   docker compose --profile core --profile monitoring up -d
# See COMPOSE.md for more profile combinations.

services:
  # ---- core ----
  scraper:
    profiles: [core]
    build:
      context: .
      target: production
    container_name: uconn-scraper
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - LOG_LEVEL=INFO
      - WORKERS=4
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-scraping_pipeline}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  redis:
    profiles: [core]
    image: redis:7-alpine
    container_name: uconn-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  stage1-worker:
    profiles: [core]
    build:
      context: .
      target: production
    container_name: stage1-worker
    restart: unless-stopped
    command: python -m src.workers.stage1_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage1
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  # No container_name when deploy.replicas > 1 (Compose Swarm conflict)
  stage2-worker:
    profiles: [core]
    build:
      context: .
      target: production
    restart: unless-stopped
    command: python -m src.workers.stage2_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage2
      - CONCURRENCY=10
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  stage3-worker:
    profiles: [core]
    build:
      context: .
      target: production
    container_name: stage3-worker
    restart: unless-stopped
    command: python -m src.workers.stage3_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage3
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  stage4-worker:
    profiles: [core]
    build:
      context: .
      target: production
    container_name: stage4-worker
    restart: unless-stopped
    command: python -m src.workers.stage4_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage4
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  # ---- monitoring / ops ----
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - scraper-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - scraper-network
    depends_on:
      - prometheus

  # Ops dashboard (dashboard/serve.py) — monitoring/ops profile
  dashboard:
    profiles: [monitoring]
    build:
      context: .
      target: production
    container_name: pipeline-dashboard
    restart: unless-stopped
    command: python dashboard/serve.py
    ports:
      - "8080:8080"
    volumes:
      - ./dashboard:/app/dashboard:ro
    networks:
      - scraper-network

  # ---- streaming (optional Postgres + Kafka matching config.yml) ----
  postgres:
    profiles: [streaming]
    image: postgres:16-alpine
    container_name: uconn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-scraping_pipeline}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    profiles: [streaming]
    image: bitnami/kafka:3.7.1
    container_name: uconn-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node (no ZooKeeper)
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ---- observability (from root docker-compose.production.yml) ----
  loki:
    profiles: [observability]
    image: grafana/loki:2.9.3
    container_name: scraping_loki
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.52
    container_name: scraping_jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - scraper-network

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.91.0
    container_name: scraping_otel_collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ../monitoring/otel-collector-config.yml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    restart: unless-stopped
    networks:
      - scraper-network
    depends_on:
      - jaeger
      - loki

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  postgres-data:
  kafka-data:
  loki_data:

networks:
  scraper-network:
    driver: bridge
