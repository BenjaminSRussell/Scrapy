# ==================================================================
# UConn Scraping Pipeline - Complete Infrastructure Stack
# ==================================================================
# Quick start: docker-compose up -d
# Stop all:    docker-compose down
# View logs:   docker-compose logs -f
# ==================================================================

services:
  # ============================================
  # Core Infrastructure
  # ============================================

  # Redis - Message queues, priority queue, circuit breaker
  redis:
    image: redis:7-alpine
    container_name: scraping_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scraping_network

  # PostgreSQL - Analytics database for metrics
  postgres:
    image: postgres:16-alpine
    container_name: scraping_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scraping_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scraping_network

  # ============================================
  # Kafka Streaming Infrastructure
  # ============================================

  # Zookeeper - Coordination service for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: scraping_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraping_network

  # Kafka - Distributed event streaming platform
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: scraping_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listener configuration for both internal and external access
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Topic configuration
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # Performance tuning
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: snappy

      # JVM settings
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"

      # Offsets topic configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - scraping_network
    depends_on:
      zookeeper:
        condition: service_healthy

  # ============================================
  # Monitoring Stack
  # ============================================

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: scraping_prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: scraping_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana_datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana_dashboard.json:/etc/garafana/provisioning/dashboards/dashboard.json
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      - prometheus

  # ============================================
  # Application Services
  # ============================================

  # Scrapy Application - Web scraping with Kafka integration
  scrapy-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraping_scrapy_app
    ports:
      - "9410:9410"  # Prometheus metrics endpoint
    environment:
      # Database connections
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scraping_pipeline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

      # Kafka configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=scraped-items

      # Scrapy settings
      - SCRAPY_SETTINGS_MODULE=src.settings
      - ENV=development
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      metrics-exporter:
        condition: service_started

  # Kafka to Delta Lake Ingestor - Consumes Kafka messages and writes to Delta Lake
  ingestor:
    build:
      context: .
      dockerfile: Dockerfile.ingestor
    container_name: scraping_ingestor
    environment:
      # Kafka configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=scraped-items
      - KAFKA_GROUP_ID=delta-ingestor
      - KAFKA_AUTO_OFFSET_RESET=earliest

      # Delta Lake configuration
      - DELTA_TABLE_PATH=/data/delta_lake/scraped_items

      # Processing configuration
      - BATCH_SIZE=1000
      - BATCH_TIMEOUT_SECONDS=30
    volumes:
      - ./data:/data
      - ./src:/app/src:ro
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      kafka:
        condition: service_healthy

  # Legacy pipeline service (renamed for clarity)
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraping_pipeline
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      metrics-exporter:
        condition: service_started

  metrics-exporter:
    build:
      context: .
      dockerfile: monitoring/Dockerfile.metrics
    container_name: scraping_metrics_exporter
    ports:
      - "8000:8000"
    command: python metrics_exporter.py --port 8000
    restart: unless-stopped
    networks:
      - scraping_network

  # Redis Exporter - Export Redis metrics to Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: scraping_redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy

  # PostgreSQL Exporter - Export PostgreSQL metrics to Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: scraping_postgres_exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/scraping_pipeline?sslmode=disable
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      postgres:
        condition: service_healthy

# ============================================
# Volumes
# ============================================
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  scraping_network:
    name: scraping_network
    driver: bridge