# Docker Compose configuration for UConn Scraping Pipeline
# Phase 10 + #144: lean core images; ML/OCR extras only on Stage 4
#
# Profiles:
#   (default)  — redis, scraper, stage1, stage2, stage3, prometheus, grafana (core only)
#   ml / full  — also starts stage4-worker (ML/OCR image)
#
# Examples:
#   docker compose up -d                          # lean Stage 1–3 stack
#   docker compose --profile ml up -d             # include Stage 4
#   docker compose --profile full up -d           # alias of ml
#
# Local pip:
#   pip install -r requirements.txt                                    # core (+ light Stage 3)
#   pip install -r requirements.txt -r requirements-ml.txt -r requirements-ocr.txt  # Stage 4
# Packaging extras (.[ml]/.[ocr]) land with PR #289 — prefer requirements-*.txt here.

version: '3.8'

services:
  # Main scraping application (core deps — no torch)
  scraper:
    build:
      context: .
      target: production
    container_name: uconn-scraper
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - LOG_LEVEL=INFO
      - WORKERS=4
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Redis for caching and queue management
  redis:
    image: redis:7-alpine
    container_name: uconn-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Stage 1: URL Discovery Worker (core image)
  stage1-worker:
    build:
      context: .
      target: core
    container_name: stage1-worker
    restart: unless-stopped
    command: python -m src.workers.stage1_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage1
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  # Stage 2: Page Analysis Worker (core image)
  # NOTE: no container_name — conflicts with deploy.replicas > 1
  stage2-worker:
    build:
      context: .
      target: core
    restart: unless-stopped
    command: python -m src.workers.stage2_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage2
      - CONCURRENCY=10
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # Stage 3: light summarization / MinHash dedupe (core image — datasketch only)
  # Commands use #262 entrypoint shims (src.workers.*)
  stage3-worker:
    build:
      context: .
      target: stage3
    container_name: stage3-worker
    restart: unless-stopped
    command: python -m src.workers.stage3_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage3
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  # Stage 4: Large Document Worker (requires ML + OCR extras)
  stage4-worker:
    profiles: ["ml", "full"]
    build:
      context: .
      target: stage4
    container_name: stage4-worker
    restart: unless-stopped
    command: python -m src.workers.stage4_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DELTA_LAKE_PATH=/data/delta
      - WORKER_ID=stage4
      - SCRAPY_EXTRAS=ml,ocr
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - scraper-network

  # Monitoring dashboard (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - scraper-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - scraper-network
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  scraper-network:
    driver: bridge
