# ==================================================================
# UConn Scraping Pipeline - Complete Infrastructure Stack
# ==================================================================
# Quick start: docker-compose up -d
# Stop all:    docker-compose down
# View logs:   docker-compose logs -f
# ==================================================================

services:
  # ============================================
  # Core Infrastructure
  # ============================================

  # Redis - Message queues, priority queue, circuit breaker
  redis:
    image: redis:7-alpine
    container_name: scraping_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scraping_network

  # PostgreSQL - Analytics database for metrics
  postgres:
    image: postgres:16-alpine
    container_name: scraping_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scraping_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scraping_network

  # ============================================
  # Kafka Streaming Infrastructure
  # ============================================

  # Zookeeper - Coordination service for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: scraping_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraping_network

  # Kafka - Distributed event streaming platform
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: scraping_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listener configuration for both internal and external access
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Topic configuration
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # Performance tuning
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: snappy

      # JVM settings
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"

      # Offsets topic configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - scraping_network
    depends_on:
      zookeeper:
        condition: service_healthy

  # ============================================
  # Monitoring Stack - High Availability Setup
  # ============================================

  # Prometheus Replica A - Primary metrics collector
  prometheus-a:
    image: prom/prometheus:latest
    container_name: scraping_prometheus_a
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - prometheus_a_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    environment:
      - PROMETHEUS_REPLICA=a
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Prometheus Replica B - Secondary metrics collector (HA)
  prometheus-b:
    image: prom/prometheus:latest
    container_name: scraping_prometheus_b
    ports:
      - "9092:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - prometheus_b_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    environment:
      - PROMETHEUS_REPLICA=b
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Alertmanager Replica 1
  alertmanager-1:
    image: prom/alertmanager:latest
    container_name: scraping_alertmanager_1
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_1_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager-2:9094'
      - '--cluster.peer=alertmanager-3:9094'
    restart: unless-stopped
    networks:
      - scraping_network

  # Alertmanager Replica 2
  alertmanager-2:
    image: prom/alertmanager:latest
    container_name: scraping_alertmanager_2
    ports:
      - "9095:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_2_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager-1:9094'
      - '--cluster.peer=alertmanager-3:9094'
    restart: unless-stopped
    networks:
      - scraping_network

  # Alertmanager Replica 3
  alertmanager-3:
    image: prom/alertmanager:latest
    container_name: scraping_alertmanager_3
    ports:
      - "9096:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_3_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager-1:9094'
      - '--cluster.peer=alertmanager-2:9094'
    restart: unless-stopped
    networks:
      - scraping_network

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: scraping_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana_datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      - prometheus-a
      - prometheus-b
      - alertmanager-1

  # ============================================
  # Application Services
  # ============================================

  # Scrapy Application - Web scraping with Kafka integration
  scrapy-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraping_scrapy_app
    ports:
      - "9410:9410"  # Prometheus metrics endpoint
    environment:
      # Database connections
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scraping_pipeline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

      # Kafka configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=scraped-items

      # Scrapy settings
      - SCRAPY_SETTINGS_MODULE=src.settings
      - ENV=development
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      metrics-exporter:
        condition: service_started

  # MinIO - S3-compatible object storage for Delta Lake (local development)
  minio:
    image: minio/minio:latest
    container_name: scraping_minio
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraping_network

  # Kafka to Delta Lake Ingestor (Rust) - High-performance streaming ingest
  kafka-delta-ingestor:
    build:
      context: ./kafka-delta-ingest
      dockerfile: ../Dockerfile.kafka-delta-ingest
    container_name: scraping_kafka_delta_ingestor
    command: >
      ingest scraped-items s3://delta-lake/scraped_data
      --kafka kafka:9092
      --app-id scrapy-ingestor
      --auto-offset-reset earliest
      --allowed-latency 60
      --max-messages-per-batch 1000
      --transform 'date: substr(scraped_at_utc, `0`, `10`)'
    environment:
      # AWS S3 configuration (pointing to MinIO for local development)
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - AWS_ALLOW_HTTP=true

      # Rust logging
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - ./data:/delta
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Python-based Kafka to Delta Lake Ingestor (Alternative/Backup)
  # Uncomment to use Python ingestor instead of Rust version
  # ingestor:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.ingestor
  #   container_name: scraping_ingestor
  #   environment:
  #     - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  #     - KAFKA_TOPIC=scraped-items
  #     - KAFKA_GROUP_ID=delta-ingestor
  #     - KAFKA_AUTO_OFFSET_RESET=earliest
  #     - DELTA_TABLE_PATH=/data/delta_lake/scraped_items
  #     - BATCH_SIZE=1000
  #     - BATCH_TIMEOUT_SECONDS=30
  #   volumes:
  #     - ./data:/data
  #     - ./src:/app/src:ro
  #   restart: unless-stopped
  #   networks:
  #     - scraping_network
  #   depends_on:
  #     kafka:
  #       condition: service_healthy

  # Legacy pipeline service (renamed for clarity)
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraping_pipeline
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      metrics-exporter:
        condition: service_started

  metrics-exporter:
    build:
      context: .
      dockerfile: monitoring/Dockerfile.metrics
    container_name: scraping_metrics_exporter
    ports:
      - "8000:8000"
    command: python metrics_exporter.py --port 8000
    restart: unless-stopped
    networks:
      - scraping_network

  # Redis Exporter - Export Redis metrics to Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: scraping_redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy

  # PostgreSQL Exporter - Export PostgreSQL metrics to Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: scraping_postgres_exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/scraping_pipeline?sslmode=disable
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      postgres:
        condition: service_healthy

# ============================================
# Volumes
# ============================================
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local
  prometheus_a_data:
    driver: local
  prometheus_b_data:
    driver: local
  alertmanager_1_data:
    driver: local
  alertmanager_2_data:
    driver: local
  alertmanager_3_data:
    driver: local
  grafana_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  scraping_network:
    name: scraping_network
    driver: bridge