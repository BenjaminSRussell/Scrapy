# ==================================================================
# UConn Scraping Pipeline - Complete Infrastructure Stack
# ==================================================================
# Quick start: docker-compose up -d
# Stop all:    docker-compose down
# View logs:   docker-compose logs -f
# ==================================================================

services:
  # ============================================
  # Core Infrastructure
  # ============================================

  # Redis - Message queues, priority queue, circuit breaker
  redis:
    image: redis:7-alpine
    container_name: scraping_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scraping_network

  # PostgreSQL - Analytics database for metrics
  postgres:
    image: postgres:16-alpine
    container_name: scraping_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scraping_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scraping_network

  # ============================================
  # Kafka Streaming Infrastructure
  # ============================================

  # Zookeeper - Coordination service for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: scraping_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraping_network

  # Kafka - Distributed event streaming platform
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: scraping_kafka
    ports:
      - "9092:9092"
      - "9094:9093"
      - "9999:9999"  # JMX metrics port
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listener configuration for both internal and external access
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Topic configuration
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # Performance tuning
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: snappy

      # JVM settings with JMX enabled
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.rmi.port=9999"

      # Offsets topic configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - scraping_network
    depends_on:
      zookeeper:
        condition: service_healthy

  # ============================================
  # Monitoring Stack - High Availability Setup
  # ============================================

  # Prometheus Replica A - Primary metrics collector
  prometheus-a:
    image: prom/prometheus:latest
    container_name: scraping_prometheus_a
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - ./monitoring/alerting_rules.yml:/etc/prometheus/alerting_rules.yml
      - prometheus_a_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    environment:
      - PROMETHEUS_REPLICA=a
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Prometheus Replica B - Secondary metrics collector (HA)
  prometheus-b:
    image: prom/prometheus:latest
    container_name: scraping_prometheus_b
    ports:
      - "9097:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - ./monitoring/alerting_rules.yml:/etc/prometheus/alerting_rules.yml
      - prometheus_b_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    environment:
      - PROMETHEUS_REPLICA=b
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Alertmanager Replica 1
  alertmanager-1:
    image: prom/alertmanager:latest
    container_name: scraping_alertmanager_1
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_1_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager-2:9094'
      - '--cluster.peer=alertmanager-3:9094'
    restart: unless-stopped
    networks:
      - scraping_network

  # Alertmanager Replica 2
  alertmanager-2:
    image: prom/alertmanager:latest
    container_name: scraping_alertmanager_2
    ports:
      - "9095:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_2_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager-1:9094'
      - '--cluster.peer=alertmanager-3:9094'
    restart: unless-stopped
    networks:
      - scraping_network

  # Alertmanager Replica 3
  alertmanager-3:
    image: prom/alertmanager:latest
    container_name: scraping_alertmanager_3
    ports:
      - "9096:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_3_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager-1:9094'
      - '--cluster.peer=alertmanager-2:9094'
    restart: unless-stopped
    networks:
      - scraping_network

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: scraping_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_PREINSTALL=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_LOG_LEVEL=info
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana_datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana_dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      - prometheus-a
      - prometheus-b
      - alertmanager-1
      - redis

  # ============================================
  # Application Services
  # ============================================

  # Scrapy Application - Web scraping with Kafka integration
  # MULTIPLE INSTANCES for maximum throughput
  scrapy-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    container_name: scraping_scrapy_app
    command: python run_multiple_scouts.py
    ports:
      - "9410-9420:9410-9420"  # Prometheus metrics endpoints for multiple instances
    env_file:
      - .env
    environment:
      # Python path
      - PYTHONPATH=/app

      # Database connections
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scraping_pipeline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

      # Kafka configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=scraped-items

      # Scrapy settings
      - SCRAPY_SETTINGS_MODULE=src.settings
      - ENV=development

      # Cloud storage (AWS/S3)
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ALLOW_HTTP=${AWS_ALLOW_HTTP:-true}

      # Number of concurrent scout instances (default: CPU count)
      - SCOUT_INSTANCES=${SCOUT_INSTANCES:-8}
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./run_multiple_scouts.py:/app/run_multiple_scouts.py:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      metrics-exporter:
        condition: service_started

  # JavaScript Bot - Renders JS-heavy pages with Playwright
  js-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    container_name: scraping_js_bot
    command: python -u src/stage1/js_bot.py
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scraping_pipeline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Stage 2 Worker - Page analysis and quality control
  stage2-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    container_name: scraping_stage2_worker
    command: python -u src/stage2/stage2_worker.py
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scraping_pipeline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Stage 3 Worker - Summarization and similarity detection
  stage3-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    container_name: scraping_stage3_worker
    command: python -u src/stage3/stage3_worker.py
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scraping_pipeline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # MinIO - S3-compatible object storage for Delta Lake (local development)
  minio:
    image: minio/minio:latest
    container_name: scraping_minio
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraping_network

  # Kafka to Delta Lake Ingestor (Rust) - High-performance streaming ingest
  kafka-delta-ingestor:
    build:
      context: .
      dockerfile: Dockerfile
      target: kafka-delta-ingest
    container_name: scraping_kafka_delta_ingest
    command: >
      ingest scraped-items ./data/delta_lake/scraped_data
      --kafka kafka:9092
      --app-id scrapy-ingestor
      --auto-offset-reset earliest
      --allowed-latency 60
      --max-messages-per-batch 1000
      --transform 'date: substr(scraped_at_utc, `0`, `10`)'
    env_file:
      - .env
    environment:
      # StatsD metrics configuration
      - STATSD_HOST=${STATSD_HOST:-statsd-exporter}
      - STATSD_PORT=${STATSD_PORT:-9125}

      # Rust logging
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
    volumes:
      - ./data:/delta
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /delta/delta_lake/scraped_data/_delta_log || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - scraping_network
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      statsd-exporter:
        condition: service_started

  metrics-exporter:
    build:
      context: .
      dockerfile: Dockerfile
      target: metrics
    container_name: scraping_metrics_exporter
    ports:
      - "9090:9090"
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    command: python metrics_exporter.py --port 9090 --interval 5
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy

  # Redis Exporter - Export Redis metrics to Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: scraping_redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      redis:
        condition: service_healthy

  # PostgreSQL Exporter - Export PostgreSQL metrics to Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: scraping_postgres_exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/scraping_pipeline?sslmode=disable
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      postgres:
        condition: service_healthy

  # Kafka JMX Exporter - Export Kafka JMX metrics to Prometheus
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: scraping_kafka_jmx_exporter
    ports:
      - "5556:5556"
    environment:
      - SERVICE_PORT=5556
      - JMX_HOST=kafka
      - JMX_PORT=9999
    command:
      - "5556"
      - "/etc/jmx-exporter/config.yml"
    volumes:
      - ./monitoring/kafka_jmx_config.yml:/etc/jmx-exporter/config.yml:ro
    restart: unless-stopped
    networks:
      - scraping_network
    depends_on:
      kafka:
        condition: service_healthy

  # StatsD Exporter - Convert StatsD metrics to Prometheus format
  # Used by kafka-delta-ingest daemon to expose metrics
  statsd-exporter:
    image: prom/statsd-exporter:latest
    container_name: scraping_statsd_exporter
    ports:
      - "9102:9102"  # Prometheus metrics endpoint
      - "9125:9125/udp"  # StatsD UDP receiver
    command:
      - "--statsd.mapping-config=/etc/statsd/statsd_mapping.yml"
    volumes:
      - ./monitoring/statsd_mapping.yml:/etc/statsd/statsd_mapping.yml:ro
    restart: unless-stopped
    networks:
      - scraping_network

# ============================================
# Volumes
# ============================================
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local
  prometheus_a_data:
    driver: local
  prometheus_b_data:
    driver: local
  alertmanager_1_data:
    driver: local
  alertmanager_2_data:
    driver: local
  alertmanager_3_data:
    driver: local
  grafana_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  scraping_network:
    name: scraping_network
    driver: bridge
